# platfolio, described the way platfolio describes everything else (D29): plain Compose for topology,
# x-platfolio for hosting semantics. This is a first-party deployment, not a catalog entry -- D28 keeps the
# shipped catalog free of platform identities, and this one is deliberately excluded from it.
#
# The point of authoring it this way is that hosting platfolio stops being an exception: the control plane is
# deployed by the same code path a tenant uses (parse -> validate -> plan -> provider), so every rough edge in
# the format is found here rather than by a tenant. #172 is the first time that has been attempted for real.
name: platfolio-control-plane

services:
  api:
    build:
      context: .
      dockerfile: apps/control-plane/Dockerfile
    expose: ["8080"]
    environment:
      NODE_ENV: production
      # No Compose-style `${VAR}` anywhere in this file, and that is a finding rather than a style choice: the
      # renderer turns `environment:` entries into plan literals (build-plan maps every value straight through),
      # so `${PLATFOLIO_DB_URL}` here would have been *written to the provider as the nine-character string*
      # and the control plane would fail at boot with a message about a malformed DSN. Values that vary per
      # deployment arrive one of three ways -- a provider-resolved `reference` below, a declared `secret` name,
      # or a literal this script overrides with what it measured. Anything else is a placeholder that looks
      # configured.
      PLATFOLIO_IDENTITY_AUDIENCE: platfolio-api
      # Issuer and JWKS are set by scripts/platform-deploy.ts from the host the provider actually granted,
      # because asserting them before DNS lands would bake in a URL that serves nothing (E27). They are listed
      # here so the inventory and the plan agree about which names this service needs.
      PLATFOLIO_IDENTITY_ISSUER: https://auth.platfolio.dev/realms/platfolio
      PLATFOLIO_IDENTITY_JWKS_URI: https://auth.platfolio.dev/realms/platfolio/protocol/openid-connect/certs
      # Its own schema, not `public`: the identity provider shares this database instance (see `identity`), and
      # two applications writing migrations into one schema is a collision waiting for its first upgrade.
      PLATFOLIO_DB_SCHEMA: platfolio
      # Migrations run at boot here and this is the one place that decision is written down: a single replica
      # starts before traffic, so there is no race to lose. Replicas would use PLATFOLIO_DB_MIGRATE=false.
      PLATFOLIO_DB_MIGRATE: 'true'
      PLATFOLIO_RECONCILE_INTERVAL_MS: '60000'
      # Email (D46). `none` until a relay is configured deliberately: the null transport refuses, reports
      # honestly and leaves the routes mounted, which is safer than a half-configured sender that appears to work.
      PLATFOLIO_EMAIL_DRIVER: none
      PLATFOLIO_EMAIL_FROM: platfolio@platfolio.dev
      PLATFOLIO_SMTP_STARTTLS: require
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 3s
      retries: 3
    x-platfolio:
      # The wiring the provider resolves into a connection string: the operator never types it and the value
      # never passes through platfolio's hands (D4). Note where it lives -- under x-platfolio, not as a top-level
      # Compose key. The renderer refuses an unknown service field rather than dropping it, which is how I found
      # I had put it in the wrong place: a silent drop here would have shipped a service with no database.
      references:
        - { variable: PLATFOLIO_DB_URL, database: main }
      # Declared by NAME, never by value (D4). The validator refused the literal I first wrote -- a credential
      # appearing in an env assignment is exactly what this platform must not store or read -- so the hosting
      # layer supplies it at run time and platfolio only knows it exists.
      # No SMTP secret is declared while PLATFOLIO_EMAIL_DRIVER is `none`. Declaring a credential the running
      # config never reads is not caution, it is noise: the provider correctly refuses a plan whose declared
      # secret has no value, so a phantom name would block the very deploy this file is meant to describe.
      # Add the entry back the moment a relay is configured -- with `driver: smtp`, the provider will require
      # the name to exist, and that is the point of declaring it rather than inlining a value (D4).
      secrets:
        # Names, never values (D4). The GitHub App's id, installation and signing key are what the two
        # repository operations need (#172's middle); they live as variables in the tenant's own Railway
        # project, which is the same custody shape as KEYCLOAK_ADMIN. Declaring them here also means
        # `platform-deploy --apply` FAILS until they exist -- the composition says out loud what the
        # service requires instead of discovering the gap at the first API call.
        - { name: PLATFOLIO_GITHUB_APP_ID, source: shared-variable }
        - { name: PLATFOLIO_GITHUB_INSTALLATION_ID, source: shared-variable }
        - { name: PLATFOLIO_GITHUB_PRIVATE_KEY, source: shared-variable }
      # The user's direction is that platfolio lives at platfolio.dev. Declared here, and #172 measures whether
      # it actually resolves rather than asserting it: E27 measured that a host whose zone we cannot edit sticks
      # at `applying` forever with no certificate -- which looks like progress and is not. platfolio.dev's zone
      # is 101domain-managed, so this needs one CNAME per subdomain from whoever holds that registrar login.
      domains: [api.platfolio.dev]
      environments: [production]

  identity:
    # Upstream Keycloak, pinned by digest (D29/D30 law 3: a tag is a thing that moves). `ownership: external`
    # is what the format calls a service we host but do not develop -- the same posture a tenant has toward
    # their dependencies, which is the point of dogfooding.
    image: keycloak/keycloak:26.8.2@sha256:c126f032d43b941ed7c5ccca7d6571596d8eab84d748afd7c86989e48ef07b8f
    # Full path, not `start`: Railway's start command replaces the image command rather than being appended to
    # an entrypoint, so a bare `start` is "command not found" -- an instant exit with zero log lines, which is
    # how this failure looked like a mysterious deployment error for a whole debugging pass. #198's own lesson:
    # the message a platform gives is part of the platform.
    # Both halves, stated. `command` alone would be correct for Docker (the image's ENTRYPOINT is kc.sh) and
    # wrong for Railway, whose start command replaces the entrypoint and runs in a shell -- which is exactly how
    # the service once exited instantly with zero log lines. Declaring `entrypoint` here makes ONE description
    # mean the same process on both runtimes (D50), and the renderer composes them into the provider's form.
    entrypoint: ['/opt/keycloak/bin/kc.sh']
    command: ['start']
    expose: ["8080"]
    environment:
      KC_DB: postgres
      # No KC_DB_SCHEMA. Keycloak's Liquibase refuses to create a schema it is told to use -- it failed with
      # `ERROR: schema "keycloak" does not exist` -- and the manifest format has no way to ask the provider to
      # create one, which is a real gap now recorded (a tenant's JVM app hitting the same wall would have no
      # answer either). So identity shares `public`, while the control plane keeps its own schema through
      # PLATFOLIO_DB_SCHEMA, which *is* created because our own migrator does it. The two cannot collide:
      # Keycloak's tables and platfolio's migration ledger are different sets in different schemas.
      # The port is an ENVIRONMENT setting in Keycloak 26, not a start flag. My first version passed
      # `--http-port=8080` and the container printed its own usage text and exited -- which the provider
      # reported honestly as a failed deployment rather than as success with a dead service.
      KC_HTTP_PORT: '8080'
      KC_HOSTNAME_STRICT: 'false'
      KC_PROXY_HEADERS: xforwarded
      KC_HTTP_ENABLED: 'true'
      # Written by the deploy script from the host the provider granted. Keycloak stamps the `iss` claim from
      # its own hostname setting, so if this and the control plane's issuer do not agree exactly, every token
      # is refused -- which is the correct failure, and one worth being explicit about in the file that sets it.
      KC_HOSTNAME: auth.platfolio.dev
      KC_HEALTH_ENABLED: 'true'
    # Keycloak 26 builds its runtime configuration on first start when the config changed, and that build phase
    # was OOM-killed at Railway's default memory ceiling (`kc.sh: line 170: 82 Killed 'java'`) before the
    # server ever got to the schema error. 2 GB is what the JVM needs to survive its own start.
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 2048M
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/realms/master').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 6
    x-platfolio:
      references:
        # #198: Keycloak wants a JDBC URL, and handing it `postgresql://…` is what kept it from booting.
        # The mechanism was never the limit -- `output` names WHICH variable on the database service to point
        # at, and Railway Postgres exposes the components below (read live from `environment.config`, which
        # returns names with values redacted). What was missing is that nothing checked the name existed.
        # No KC_DB_URL at all: Keycloak assembles the JDBC string from host/port/database, which also keeps
        # the password out of a URL that something other than Keycloak might log.
        - { variable: KC_DB_URL_HOST, database: main, output: PGHOST }
        - { variable: KC_DB_URL_PORT, database: main, output: PGPORT }
        - { variable: KC_DB_URL_DATABASE, database: main, output: POSTGRES_DB }
        - { variable: KC_DB_USERNAME, database: main, output: POSTGRES_USER }
        - { variable: KC_DB_PASSWORD, database: main, output: POSTGRES_PASSWORD }
      secrets:
        # Keycloak's initial admin, by name. The seed script reads the same variable from the environment it is
        # run with; platfolio stores no secret values (D4).
        - { name: KEYCLOAK_ADMIN, source: shared-variable }
        - { name: KEYCLOAK_ADMIN_PASSWORD, source: shared-variable }
      public: true
      domains: [auth.platfolio.dev]
      ownership: external
      environments: [production]

  # One provider-managed Postgres for the whole deployment. `singleUser` semantics apply: Railway creates the
  # service and the connection string, and the two applications above each get their own schema.
x-platfolio:
  metadata:
    name: platfolio-control-plane
    version: 0.4.0
    title: Platfolio Control Plane
    summary: The control plane hosting itself, so the hosting path is tested on software we own.
    archetype: full-stack-web
    repository: https://github.com/fractalsynapse/platfolio
  capabilities: []
  resources:
    database: { name: main, kind: postgres }
  environments:
    production: { enabled: true, branch: staging }
    staging: { enabled: false }
    preview: { enabled: false }
  dns:
    ownershipVerification: txt
    apexPolicy: cname-flattening-only
  lifecycle:
    onSuspend: scale-to-zero
    onEject: [compose, data-export]
    onDelete: { graceDays: 30, backupAgeOutDays: 90 }
  release:
    registryImage: ghcr.io/fractalsynapse/platfolio-control-plane
    dockerfile: apps/control-plane/Dockerfile
    tagPattern: "{branch}"
