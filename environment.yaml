# The central environment registry (D52).

# Every variable this project reads or deploys: whether it carries a credential (a custody claim, not a
# guess), which environments it applies to -- development | staging | production, or all -- and where its
# value actually lives.

# Enforced both ways by `pnpm run environment:registry`: an undeclared variable and a declaration nothing
# references are both failures, as is a variable defined twice or the full set written any way but `all`.
# Regenerate the skeleton with --emit; judgement calls belong in the HUMAN table inside that script, never
# hand-edited here, or the next regeneration silently loses them.
variables:
  - name: CONTROL_PLANE_BASE
    kind: value
    secret: false
    environments: [development]
    deployedTo: host:shell
    note: "which control plane a smoke script points at; never a deployment value"
  - name: CR_PAT
    kind: secret
    secret: true
    environments: all
    deployedTo: ci:secret
    note: "GitHub Packages push token used by the image workflow"
  - name: DATABASE_URL
    kind: secret
    secret: true
    environments: all
    deployedTo: host:shell
    note: "read by the tenant application (starter-web); platfolio resolves the production value from the database reference"
  - name: KC_ADMIN_PASSWORD
    kind: secret
    secret: true
    environments: [development]
    deployedTo: host:shell
    note: "referenced by scripts/seed-identity.ts, scripts/smoke-identity.ts"
  - name: KC_ADMIN_USER
    kind: value
    secret: false
    environments: [development]
    deployedTo: host:shell
    note: "referenced by scripts/seed-identity.ts"
  - name: KC_BASE
