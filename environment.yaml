  - name: PLATFOLIO_SMTP_USER
    kind: value
    secret: false
    environments: [staging, production]
    deployedTo: railway:variable
    note: "Optional relay for the installation API or a fresh private Keycloak realm. The development API overlay can use Mailpit."
  - name: PLATFOLIO_STARTER_HEALTH_URL
    kind: value
    secret: false
    environments: [staging]
    deployedTo: railway:variable
    note: "Optional private starter runtime health URL for the pilot worker."
  - name: PLATFOLIO_TEAM_ID
    kind: value
    secret: false
    environments: [development]
    deployedTo: host:shell
    note: "referenced by apps/managed-action/src/runner.ts"
  - name: PLATFOLIO_URL
    kind: value
    secret: false
    environments: all
    deployedTo: ci:env
    note: "referenced by .github/actions/platfolio-managed/action.yml, .github/workflows/platfolio-managed.yml, apps/managed-action/src/main.ts, packages/manifest/src/render-install.ts"
  - name: PLATFOLIO_WEB_CLIENT_ID
    kind: value
    secret: false
    environments: all
    required: false
    default: "platfolio-web"
    deployedTo: host:shell
    note: "which public PKCE client `apps/site` authenticates as. Optional because the default is the policy constant `WEB_CLIENT_ID` in `packages/ui/src/web/browser-auth-policy.ts` -- the same value `identity:seed` writes into the realm -- and a deploy renames it only when its realm renamed the client. Not a secret: a browser client id is public by construction (D4), which is why `secret: false` is stated rather than guessed from the name"
  - name: POSTGRES_DB
    kind: value
    secret: false
    environments: all
    deployedTo: ci:env
    note: "referenced by .github/workflows/development.yml, .github/workflows/integration.yml, compose.dev.yaml"
  - name: PGDATA
    kind: value
    secret: false
    environments: [staging, production]
    deployedTo: railway:variable
    note: "PostgreSQL uses a subdirectory of the Railway volume so initialization can leave the mount’s lost+found directory intact."
  - name: POSTGRES_PASSWORD
    kind: secret
    secret: true
    environments: all
    deployedTo: railway:variable
    note: "Railway generates the private installation’s database password. Development and CI use disposable values."
  - name: RAILWAY_API_TOKEN
    kind: secret
    secret: true
    environments: [development]
    deployedTo: host:shell
    note: "Workspace token forwarded in memory to the customer-side Railway CLI process."
  - name: RAILWAY_PRIVATE_DOMAIN
    kind: value
    secret: false
    environments: [staging, production]
    deployedTo: railway:variable
    note: "Railway supplies the service DNS name for same-environment private connections."
  - name: RAILWAY_PUBLIC_DOMAIN
    kind: value
    secret: false
    environments: [staging, production]
    deployedTo: railway:variable
    note: "Railway supplies the generated domain for each browser-facing installation service."
  - name: RAILWAY_RUN_UID
    kind: value
    secret: false
    environments: [staging]
    deployedTo: railway:variable
    note: "Allows the OpenBao entrypoint to prepare its volume before dropping privileges."
  - name: RAILWAY_TOKEN
    kind: secret
    secret: true
    environments: all
    deployedTo: github:environment-secret
    note: "the provider grant. Exactly one per managed instance (D24), held as a GitHub environment secret so platfolio never stores it"
  - name: RAILWAY_WORKSPACE_ID
