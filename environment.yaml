# The central environment registry (D52).

# Every variable this project reads or deploys: whether it carries a credential (a custody claim, not a
# guess), which environments it applies to -- development | staging | production, or all -- and where its
# value actually lives.

# Enforced both ways by `pnpm run environment:registry`: an undeclared variable and a declaration nothing
# references are both failures, as is a variable defined twice or the full set written any way but `all`.
# Regenerate the skeleton with --emit; judgement calls belong in the HUMAN table inside that script, never
# hand-edited here, or the next regeneration silently loses them.
variables:
  - name: BAO_LOCAL_CONFIG
    kind: value
    secret: false
    environments: [staging]
    deployedTo: railway:variable
    note: "OpenBao private listener and Raft storage settings. Contains no recovery material."
  - name: CONTROL_PLANE_BASE
    kind: value
    secret: false
    environments: [development]
    deployedTo: host:shell
    note: "which control plane a smoke script points at; never a deployment value"
  - name: CR_PAT
    kind: secret
    secret: true
    environments: all
    deployedTo: ci:secret
    note: "GitHub Packages push token used by the image workflow"
  - name: DATABASE_URL
    kind: secret
    secret: true
    environments: all
    deployedTo: host:shell
    note: "read by the tenant application (starter-web); platfolio resolves the production value from the database reference"
  - name: KC_ADMIN_PASSWORD
    kind: secret
    secret: true
    environments: [development]
    deployedTo: host:shell
    note: "referenced by scripts/seed-identity.ts, scripts/smoke-identity.ts"
  - name: KC_ADMIN_USER
    kind: value
    secret: false
    environments: [development]
    deployedTo: host:shell
    note: "referenced by scripts/seed-identity.ts"
  - name: KC_BASE
    kind: value
    secret: false
    environments: [development]
    deployedTo: host:shell
    note: "referenced by scripts/seed-dev-data.ts, scripts/seed-identity.ts, scripts/smoke-identity.ts, scripts/smoke-invitations.ts"
  - name: KC_BOOTSTRAP_ADMIN_PASSWORD
    kind: secret
    secret: true
    environments: all
    service: identity
    required: true
    rotate: on-demand
    deployedTo: railway:shared-variable
    note: "the bootstrap admin password, declared by NAME in the composition and delivered through PUT …/secrets/{name} or platform-deploy --deliver-secrets; platfolio stores no value (D4). Read by 26.8 only when the master realm does not exist yet, so this obligates new deployments and recovers nothing on a running one (#248)"
  - name: KC_BOOTSTRAP_ADMIN_USERNAME
    kind: value
    secret: false
    environments: all
    service: identity
    deployedTo: railway:variable
    note: "the bootstrap admin username Keycloak 26.x reads at FIRST start only, when the master realm does not exist yet; a username is not a credential, so it is a composition literal -- the same shape the published shared-identity template uses (D50)"
  - name: KC_CLIENT_SECRET
    kind: secret
    secret: true
    environments: [development]
    deployedTo: host:shell
    note: "referenced by scripts/seed-identity.ts, scripts/smoke-identity.ts"
