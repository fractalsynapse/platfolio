  /api/v1/railway/callback:
    get:
      operationId: completeStarterRailwayAuthorization
      summary: Complete the one-use Railway authorization and return to Platfolio
      description: The worker binds the provider response to the owner-initiated state and PKCE verifier.
      security: []
      parameters:
        - { name: state, in: query, schema: { type: string } }
        - { name: code, in: query, schema: { type: string } }
        - { name: iss, in: query, schema: { type: string } }
