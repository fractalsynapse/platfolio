          headers:
            location: { schema: { type: string, format: uri } }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/teams/{teamId}/starter-launch:
    parameters:
      - { name: teamId, in: path, required: true, schema: { type: string } }
      - { name: template, in: query, schema: { type: string, enum: [shared-identity, starter-worker] } }
    get:
      operationId: getStarterLaunch
      summary: Read the deployment timeline and troubleshooting evidence
      security: [{ bearerJwt: [] }]
      responses:
        '200': &starter-launch-response
          description: The current launch state and safe operation history.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [state, events, template, revision, retainedVolumes]
                properties:
                  state: { type: string, enum: [idle, running, ready, failed, removing, kept, wiped] }
                  template: { type: string }
                  revision: { type: string }
                  version: { type: string }
                  registration: { type: string, enum: [pending, recorded, conflict] }
                  instanceName: { type: string }
                  projectId: { type: string }
                  removedProjectId:
                    type: string
                    format: uuid
                    description: The project identified by the verified permanent removal receipt.
                  deploymentId: { type: string }
                  origin: { type: string, format: uri }
                  retainedVolumes: { type: array, items: { type: string } }
                  events:
                    type: array
                    items:
                      type: object
                      additionalProperties: false
                      required: [at, step, state]
                      properties:
                        at: { type: string, format: date-time }
                        step: { type: string }
                        state: { type: string }
                        resourceId: { type: string }
                        detail: { type: string }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': *launch-unavailable
    post:
      operationId: startStarterLaunch
      summary: Launch or resume a pinned template using the connected customer runner
      description: A fresh install uses the selected release from the connected hub. Resuming setup or restoring uses the release already recorded in the private installation.
      security: [{ bearerJwt: [] }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                release: { $ref: '#/components/schemas/MarketplaceReleaseSelection' }
                bootstrap: { type: string, pattern: '^[A-Za-z0-9+/]{512}$', description: Shared Identity bootstrap material encrypted to the private worker for first setup. Restoring a verified installation uses its existing database and credentials. }
      responses:
        '200': *starter-launch-response
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: The selected marketplace release is unavailable or conflicts with the existing install.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '503': *launch-unavailable
  /api/v1/teams/{teamId}/starter-launch/remove:
    parameters:
      - { name: teamId, in: path, required: true, schema: { type: string } }
      - { name: template, in: query, schema: { type: string, enum: [shared-identity, starter-worker] } }
    post:
      operationId: removeStarterLaunch
      summary: Remove this starter using the explicitly selected storage policy
      security: [{ bearerJwt: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [data]
              properties:
                data: { type: string, enum: [keep, wipe] }
                confirmation: { type: string }
      responses:
        '200': *starter-launch-response
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: The app supplies a service used by another instance.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '503': *launch-unavailable


components:
  securitySchemes:
    hubIdentityProof:
      type: apiKey
      in: header
      name: X-Platfolio-Hub-Proof
      description: Bearer access token issued for this private installation's dedicated hub client.
    marketplaceCredential:
      type: http
      scheme: bearer
      description: A short-lived enrollment code or a private installation's registry credential, depending on the operation.
    bearerJwt:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Access token issued by platfolio's Keycloak realm. Verified against JWKS pinned to the configured
        issuer; `RS256` only, and `alg: none` or an HMAC-shaped token is refused regardless of what the
        attacker's header claims (algorithm-confusion is the reason the allowed set is checked, not assumed).

  responses:
    Forbidden:
      description: |
        The caller is a member of the team and can see the resource, but the action needs a higher role (#178).
        403 rather than the 404 used for non-members: hiding existence protects people who have no right to
        know it, and is useless advice to someone who already does.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: conflict, message: 'capability.share requires the owner role on this team' }

    NotFound:
      description: |
        No such resource, or a resource belonging to a team the caller is not a member of -- one answer for
        both, because the difference is itself information (#173).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: not-found, message: 'no such resource for this principal' }

    Conflict:
      description: The operation conflicts with the current launch state.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

    BadRequest:
      description: 'The request was well-formed HTTP but did not satisfy the schema: names and reasons, never values.'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: invalid-request, message: 'plan must carry the bare 64-hex planHash computed by buildPlan' }

    Unauthenticated:
      description: No token, a token that failed verification, or one that is expired or not yet valid.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: unauthenticated, message: 'token signature does not match the pinned issuer key set' }
      headers:
        WWW-Authenticate:
          description: The challenge, so a client can distinguish "no credentials" from "bad credentials".
          schema: { type: string }
          example: 'Bearer realm="platfolio", error="invalid_token"'

