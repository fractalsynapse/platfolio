    post:
      operationId: redeployHostedStarter
      summary: Redeploy an installed marketplace release at its saved pin in the existing staging project
      description: The private hosting plugin reuses the recorded project and storage. Follow app setup for provider verification.
      security: [{ bearerJwt: [] }]
      responses:
        '202':
          description: The private worker accepted the requested deployment.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [state]
                properties:
                  state: { type: string, enum: [requested] }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: The app is stopped or another setup step is in progress.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '503':
          description: The private worker, OpenBao, or Railway is unavailable.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/v1/instances/{instanceId}/environments/{environment}:
    parameters:
      - { name: instanceId, in: path, required: true, schema: { type: string, minLength: 1 } }
      - { name: environment, in: path, required: true, schema: { type: string, minLength: 1, maxLength: 60 } }
    get:
      operationId: getInstanceEnvironment
      summary: Read the environment's planned services, domains, and deployment reports
      description: Secret names are included. Values and private credential material are excluded. A planned domain is not a report of public availability.
      security: [{ bearerJwt: [] }]
      responses:
        '200':
          description: Planned resources and recent reports scoped to this environment.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [planned, services, domains, deployments]
                properties:
                  planned: { type: boolean }
                  hosting: { $ref: '#/components/schemas/HostedStarter' }
                  services:
                    type: array
                    items:
                      type: object
                      additionalProperties: false
                      required: [name, secrets]
                      properties:
                        name: { type: string }
                        secrets: { type: array, items: { type: string } }
                  domains:
                    type: array
                    items:
                      type: object
                      additionalProperties: false
                      required: [host, service]
                      properties:
                        host: { type: string }
                        service: { type: string }
                  deployments:
                    type: array
                    items:
                      type: object
                      additionalProperties: false
                      required: [id, result, reportedAt]
                      properties:
                        id: { type: string }
                        result: { type: string, enum: [ok, partial, failed, noop] }
                        reportedAt: { type: string, format: date-time }
                        commit: { type: string }
                        problem: { type: string }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/instances/{instanceId}/plan:
    parameters:
      - name: instanceId
        in: path
        required: true
        schema: { type: string, minLength: 1 }
    put:
      operationId: putPlan
      summary: Record the desired state and the digest a runner must satisfy
      description: |
        The plan is stored with the digest `buildPlan` computed for it. The API does not re-derive a hash: a
        second implementation of a truth that has one home is the bug that made every honest attestation fail
        with 400 once already.
      security:
        - bearerJwt: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [plan]
              properties:
                plan:
                  type: object
                  description: An InfraPlan, whose own `planHash` is the authority. Carries topology and digests; never a credential value (D4).
      responses:
        '200':
          description: Stored, with the hash future dispatches will require.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [instanceId, planHash]
                properties:
                  instanceId: { type: string }
                  planHash: { type: string, pattern: '^[0-9a-f]{64}$' }
              example: { instanceId: inst-1f7c2b, planHash: '5f976b5435bf434e00000000000000000000000000000000000000000000abcd' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          description: No such instance.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/v1/instances/{instanceId}/plan/from-repository:
    parameters:
      - name: instanceId
        in: path
        required: true
        schema: { type: string, minLength: 1 }
    post:
      operationId: registerPlanFromRepository
      summary: Build and record the desired state from the tenant's own repository
      description: |
        The missing middle (#172). Until now the plan arrived already built, which meant a human holding a
        checkout: `open-install-pr.ts --platform <local directory>` read the MAINTAINER's filesystem and the
        tenant's repository was never consulted. This operation makes platfolio do the reading itself --
        `compose.yaml` (plus the pinned overlay, if the platform has one) fetched from the commit the instance
        already cites, parsed with the same manifest package the CLI and the tests use, and registered exactly
        as `PUT …/plan` would.

        What is deliberately NOT here:

        - **No re-derived digest.** `buildPlan` computes `planHash`, and the recorded value is the one a runner
          must satisfy. The API re-hashing a plan would recreate the bug that made every honest attestation
          fail with 400 -- two implementations of a truth that has one home.
        - **No floating refs.** The read is against `templateRef.commitSha`, the pinned identity the instance
          carries (D29/D30, law 3). A branch name would let a plan be built from content that no longer exists
          by the time it is applied.
        - **No unpinned first-party images.** The manifest renderer refuses them (#84) and this operation
          propagates that refusal as a 400 quoting the renderer, rather than deploying a moving tag and
          reporting success.

        The response names the blob SHA GitHub reported for each file, so an operator can confirm the plan was
        built from the bytes they think they pushed.
      security:
        - bearerJwt: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                path:
                  type: string
                  description: Manifest location within the repository. Default `compose.yaml`.
                  default: compose.yaml
                overlayPath:
                  type: string
                  description: >-
                    The pinned production overlay. Default `compose.prod.yaml`. Absent is allowed only when
                    every service in `path` already carries a digest; otherwise the refusal says which service
                    is unpinned.
                  default: compose.prod.yaml
                environments:
                  type: array
                  description: Environments to plan. Omit to include every enabled environment.
                  minItems: 1
                  maxItems: 2
                  uniqueItems: true
                  items: { type: string, enum: [staging, production] }
      responses:
        '200':
          description: The plan is recorded; a runner may now be asked to satisfy this digest.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [instanceId, planHash, source, summary]
                properties:
                  instanceId: { type: string, minLength: 1 }
                  planHash: { type: string, pattern: '^[0-9a-f]{64}$' }
                  source:
                    type: object
                    additionalProperties: false
                    required: [repo, ref, files]
                    properties:
                      repo: { type: string, minLength: 3 }
                      ref: { type: string, pattern: '^[0-9a-f]{40}$' }
                      files:
                        type: array
                        minItems: 1
                        description: Every file that contributed to the plan, with GitHub's blob identity.
                        items:
                          type: object
                          additionalProperties: false
                          required: [path, blobSha]
                          properties:
                            path: { type: string, minLength: 1 }
                            blobSha: { type: string, pattern: '^[0-9a-f]{40}$' }
                            size: { type: integer, minimum: 0 }
                  summary:
                    type: object
                    additionalProperties: false
                    required: [services, environments]
                    properties:
                      services: { type: integer, minimum: 0 }
                      databases: { type: integer, minimum: 0 }
                      environments:
                        type: array
                        items: { type: string, minLength: 1 }
                  warnings:
                    type: array
                    description: >-
                      Non-fatal truths the caller must see -- an unpinned public image, a reference the provider
                      could not verify. Never used to soften a failure into a pass.
                    items:
                      type: object
                      additionalProperties: false
                      required: [code, message]
                      properties:
                        code: { type: string, minLength: 1 }
                        message: { type: string, minLength: 1 }
        '400':
          description: >-
            The instance cites no commit, or the documents it names cannot become a plan: unpinned first-party
            image, invalid manifest, unreadable Compose. The message quotes the reason the renderer gave.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: >-
            The platfolio GitHub App installation cannot see the repository (#130) -- distinct from a missing
            path on purpose, because the fix is a different action entirely.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          description: >-
            Source control is not configured for this platfolio deployment. Reported rather than emulated: an
            empty plan would claim a platform that nobody described.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          $ref: '#/components/responses/Unauthenticated'

  /api/v1/instances/{instanceId}/dispatches/{dispatchId}/trigger:
    parameters:
      - name: instanceId
        in: path
        required: true
        schema: { type: string, minLength: 1 }
      - name: dispatchId
        in: path
        required: true
        schema: { type: string, minLength: 1 }
    post:
      operationId: triggerDispatch
      summary: Ask the tenant's own repository to run the work platfolio just decided
      description: |
        The other half of the middle. Creating a dispatch records platfolio's INTENT; nothing happens until the
        tenant's workflow runs, because the tenant's credentials are the only ones that may touch the tenant's
        provider account (D24). This call asks GitHub to run it.

        Two measured properties shape it:

        - GitHub enumerates workflows from the DEFAULT branch only (#149), so an install PR that was never
          merged and a misspelled workflow name are the identical 404. The message says both, because guessing
          which one wasted a whole debugging pass the first time.
        - A dispatch is single-use: `GET …/dispatches/{id}` consumes it and a second read answers 409. So a
          trigger after consumption is refused here too -- re-dispatching would leave a runner fetching a plan
          that no longer exists.
      security:
        - bearerJwt: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [ref]
              properties:
                ref:
                  type: string
                  minLength: 1
                  description: >-
                    Branch or tag GitHub should run on. Not the plan's commit: a workflow run belongs to a
                    branch, and the digest it must satisfy travels as an input.
                workflow:
                  type: string
                  description: Workflow file name. Default `platfolio-managed.yml`.
                  default: platfolio-managed.yml
      responses:
        '202':
          description: >-
            GitHub accepted the request. Acceptance is not completion: the outcome arrives later as an
            attestation, which platfolio verifies against the provider before it believes anything.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [instanceId, dispatchId, repo, ref, workflow, state]
                properties:
                  instanceId: { type: string, minLength: 1 }
                  dispatchId: { type: string, minLength: 1 }
                  repo: { type: string, minLength: 3 }
                  ref: { type: string, minLength: 1 }
                  workflow: { type: string, minLength: 1 }
                  state: { type: string, const: requested }
        '400':
          description: The instance cites no repository, or the dispatch's plan has no digest to pass along.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: Unknown instance or dispatch, or a dispatch belonging to a different team.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: The dispatch was already consumed by a runner fetch, or is not in a triggerable state.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '502':
          description: >-
            GitHub refused the run. The provider's own words are passed through, redacted: an operator debugging
            a refused dispatch needs the reason, not a status code.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '503':
          description: Source control is not configured for this platfolio deployment.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          $ref: '#/components/responses/Unauthenticated'
  /api/v1/instances/{instanceId}/artifacts:
    parameters:
      - name: instanceId
        in: path
        required: true
        schema: { type: string, minLength: 1 }
    post:
      operationId: reportArtifact
      summary: Report what the platform's own build published
      description: |
        The release pipeline's one required interaction with platfolio (D54), and the reason a fork needs no
        pin file. A service declared with `build:` is compiled by the tenant, and its digest is a fact about the
        registry rather than about source control -- so it is reported here instead of committed, which is the
        difference between a value that goes stale silently and one that every build re-asserts.

        `plan/from-repository` reads these records to fill in the digest. A platform that has never reported one
        is refused with the service named, because the true cause is a pipeline that has not run, not a
        malformed document.

        Deliberately NOT checked here: whether the digest exists in the registry. platfolio holds no tenant
        registry credentials, and today's 404 becomes tomorrow's 403. The artifact becomes load-bearing where
        the contract already has verification: the plan hash a runner must attest against is derived from it,
        and D30 law 1 means platfolio deploys trusting the report and then proves the result from the
        provider's own state.
      security:
        - bearerJwt: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [service, image, digest]
              properties:
                service:
                  type: string
                  minLength: 1
                  maxLength: 60
                  description: The compose service name this artifact belongs to.
                image:
                  type: string
                  minLength: 3
                  maxLength: 300
                  description: Repository without tag or digest, e.g. `ghcr.io/acme/widget`.
                digest:
                  type: string
                  pattern: '^sha256:[0-9a-f]{64}$'
                  description: The immutable identity. A tag is not accepted, because a tag is a thing that moves.
                sourceRef:
                  type: string
                  pattern: '^[0-9a-f]{40}$'
                  description: Commit the artifact was built from, when the builder knows it.
                version:
                  type: string
                  minLength: 1
                  maxLength: 80
      responses:
        '201':
          description: Recorded. The newest report per (instance, service) replaces the previous one.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [instanceId, service, image, digest, reportedAt]
                properties:
                  instanceId: { type: string, minLength: 1 }
                  service: { type: string, minLength: 1 }
                  image: { type: string, minLength: 3 }
                  digest: { type: string, pattern: '^sha256:[0-9a-f]{64}$' }
                  reportedAt: { type: string, minLength: 1 }
        '400':
          description: A digest that is not `sha256:` plus 64 hex, an unknown shape, or a body that is not an object.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/instances/{instanceId}/secrets:
    parameters:
      - name: instanceId
        in: path
        required: true
        schema: { type: string, minLength: 1 }
    get:
      operationId: listSecretPresence
      summary: Which declared credentials are filled in -- presence, never value
      description: |
        Presence is the only claim platfolio can honestly make about a secret (D4, D53). The provider redacts
        secret values on read -- measured, `{ value: null }` even moments after a write -- so "the variable
        exists" is the strongest available statement, and also the one an operator needs: the difference between
        "this install is incomplete" and "this install works".

        The names are not free-floating. They come from the registered plan's own `secrets` declarations, so this
        endpoint cannot be used to probe a tenant's environment for variables the platform never asked for.
      security:
        - bearerJwt: []
      parameters:
        - name: environment
          in: query
          required: true
          schema: { type: string, minLength: 1 }
        - name: service
          in: query
          required: true
          schema: { type: string, minLength: 1 }
      responses:
        '200':
          description: One entry per declared secret name for that service and environment.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [instanceId, environment, service, presence]
                properties:
                  instanceId: { type: string, minLength: 1 }
                  environment: { type: string, minLength: 1 }
                  service: { type: string, minLength: 1 }
                  presence:
                    type: array
                    items:
                      type: object
                      additionalProperties: false
                      required: [name, state]
                      properties:
                        name: { type: string, minLength: 1 }
                        state: { type: string, enum: [set, missing, unverifiable] }
        '400':
          description: No plan registered for this instance, or the environment/service is not in it.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '501':
          description: The selected provider cannot read presence. Said so, rather than answered as `missing`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/v1/instances/{instanceId}/secrets/{name}:
    parameters:
      - name: instanceId
        in: path
        required: true
        schema: { type: string, minLength: 1 }
      - name: name
        in: path
        required: true
        schema: { type: string, minLength: 1, maxLength: 120 }
    put:
      operationId: putSecret
      summary: Deliver one credential into the tenant's own provider environment
      description: |
        Write-through, not custody (D53). The value crosses this request and goes to the provider: platfolio does
        not store it, does not echo it, does not log it, and cannot read it back -- which is why the success
        response is 204 with no body, and why confirmation is presence asked for separately by name.

        Owner-only. A member may deploy a platform; substituting the credential a service runs with is a
        different kind of act, and D43's reasoning applies one layer down.

        `platfolio-held` custody -- platfolio storing the value and serving it at boot -- stays forbidden by D4.
        This path is the alternative to it, not a version of it.

        WHERE the value lands is decided by the platform description, not by the caller: the registered plan's
        `secrets` entry for this service in this environment carries the source, and `source: shared-variable`
        means the provider writes at environment scope and attaches the declaring service -- two calls, the
        second being what makes the credential readable. A name the description never declared is refused as
        `secret-not-declared`; no registered plan at all is `no-plan`.

        204 means the provider accepted the write. `verified` is deliberately absent: inviting a retry loop
        against a provider that redacts values would make the API encourage polling for something that cannot be
        observed.
      security:
        - bearerJwt: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [service, environment, value]
              properties:
                service:
                  type: string
                  minLength: 1
                  maxLength: 60
                environment:
                  type: string
                  minLength: 1
                  maxLength: 60
                value:
                  type: string
                  minLength: 1
                  maxLength: 8192
                  description: The credential. Never returned by any endpoint; never written to the audit record.
                refresh:
                  type: string
                  enum: [suppress, auto]
                  description: |
                    What the write does to the RUNNING service. The default, `suppress`, writes the variable and
                    leaves the container alone -- the behaviour every delivery had before this field existed, and
                    still the default, because a platform that cannot read a value back (D4) must not silently
                    restart things on a write that changed nothing.

                    `auto` sends the write without Railway's `skipDeploys` suppression and lets the provider's own
                    comparison decide. Measured 2026-11-15 in docs/research/: a changed value started a new
                    deployment on its own; an identical value started nothing. So the restart is triggered by the
                    party that holds the value, and platfolio never stores, reads, or hashes one -- which is the
                    tradeoff this design accepts in exchange for keeping D4 intact.
      responses:
        '204':
          description: Delivered to the provider. No body, because there is nothing platfolio is allowed to say back.
        '400':
          description: An empty value, or a name that is not a variable name.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          description: The caller is not an owner of this team.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: Unknown instance, or an environment/service that does not exist in the tenant's project.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '501':
          description: The selected provider cannot deliver secrets.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '502':
          description: The provider refused. Its words are forwarded, redacted -- the only evidence available.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '503':
          description: OpenBao is not ready in the customer launcher.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /api/v1/instances/{instanceId}/dispatches:
    parameters:
      - name: instanceId
        in: path
        required: true
        schema: { type: string, minLength: 1 }
    post:
      operationId: createDispatch
      summary: Issue a single-use instruction for the managed workflow
      description: |
        Returns the dispatch intent the workflow passes to GitHub as inputs. The nonce is the freshness token
        the runner must echo back; the plan hash is what it must still find on the way to the provider.
      security:
        - bearerJwt: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                action: { type: string, enum: [apply, check, drift, suspend, export], default: apply }
                environment: { type: string, minLength: 1, maxLength: 60, default: production }
            example: { action: apply, environment: production }
      responses:
        '201':
          description: Dispatch issued.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [intent]
                properties:
                  intent: { $ref: '#/components/schemas/DispatchIntent' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          description: No plan registered for this instance yet.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/v1/instances/{instanceId}/dispatches/{dispatchId}:
    parameters:
      - name: instanceId
        in: path
        required: true
        schema: { type: string, minLength: 1 }
      - name: dispatchId
        in: path
        required: true
        schema: { type: string, minLength: 1 }
    get:
      operationId: getDispatchPlan
      summary: The plan a runner is authorised to apply -- exactly once
      description: |
        Consumes the dispatch. A second read is a replay, not a retry: it answers 409 so a duplicated or
        retried GitHub job cannot apply the same plan twice. This is the property the store enforces
        conditionally in SQL, which is why it holds across processes rather than within one.
      security:
        - bearerJwt: []
      responses:
        '200':
          description: The plan and the hash it must match.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [plan, planHash, issuedAt, expiresAt]
                properties:
                  plan: { type: object }
                  planHash: { type: string, pattern: '^[0-9a-f]{64}$' }
                  issuedAt: { type: string, format: date-time }
                  expiresAt: { type: string, format: date-time }
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          description: Unknown dispatch, or a dispatch belonging to another instance.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: Already consumed -- this dispatch has a runner, or had one that died mid-apply.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/v1/attestations:
    post:
      operationId: postAttestation
      summary: A runner reports what happened
      description: |
        Accepted once per dispatch, and only if it agrees with that dispatch on nonce, plan hash, action and
        environment. Policy lives in `checkAttestationPolicy`, shared by every store implementation, because a
        security decision must not be re-implemented per driver.

        Today the caller is authenticated by a shared secret, so `actorKind` defaults to `shared-secret` rather
        than implying a verified repository binding (#159). The read-back rule is what makes a false claim
        harmless, and that is a thinner defence than it sounds like.
      security:
        - bearerJwt: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Attestation' }
      responses:
        '202':
          description: Recorded.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [accepted, dispatchId, result]
                properties:
                  accepted: { type: boolean, const: true }
                  dispatchId: { type: string }
                  result: { type: string, enum: [ok, partial, failed, noop] }
        '400':
          description: Refused by the acceptance policy, or malformed. The reason is machine-readable.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '409':
          description: This dispatch has already been attested.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/v1/instances/{instanceId}/latest-attestation:
    parameters:
      - name: instanceId
        in: path
        required: true
        schema: { type: string, minLength: 1 }
    get:
      operationId: getLatestAttestation
      summary: The most recent result for this instance, newest first
      description: |
        A claim that agrees with something is still only a claim: the control plane verifies against the
        provider before presenting it as state. This endpoint returns the record; the reconciliation is
        elsewhere on purpose.
      security:
        - bearerJwt: []
      responses:
        '200':
          description: The latest attestation.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AttestationRecord' }
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          description: Nothing has attested for this instance.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/v1/instances/{instanceId}/status:
    parameters:
      - { name: instanceId, in: path, required: true, schema: { type: string } }
    get:
      operationId: getHostedAppStatus
      summary: Read the latest availability and outage updates for a hosted app
      security: [{ bearerJwt: [] }]
      responses:
        '200':
          description: Private availability checks and changes recorded for the app.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [environment, state, updates]
                properties:
                  environment: { type: string, enum: [staging] }
                  state: { type: string, enum: [checking, up, down, paused, removed] }
                  checkedAt: { type: string, format: date-time }
                  updates:
                    type: array
                    items:
                      type: object
                      additionalProperties: false
                      required: [id, at, state]
                      properties:
                        id: { type: string }
                        at: { type: string, format: date-time }
                        state: { type: string, enum: [down, up, paused, removed] }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/teams/{teamId}/activity:
    parameters:
      - { name: teamId, in: path, required: true, schema: { type: string } }
    get:
      operationId: listTeamActivity
      summary: Read recent operations for one team and its apps
      security: [{ bearerJwt: [] }]
      responses:
        '200':
          description: The most recent 100 recorded operations in this team.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/AuditEntry' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/audit:
    get:
      operationId: listAudit
      summary: What the platform did to the caller's platforms, and who did it
      description: |
        Newest first, bounded by `limit`, and filtered to rows about instances the caller's teams own -- an
        audit trail is a disclosure surface. Detail carries ids and reason codes, never payloads, and never a
        credential: the store refuses an over-long detail value as a value rather than throwing, because an
        audit write that aborts the loop it is recording makes the trail less trustworthy, not more.
      security:
        - bearerJwt: []
      parameters:
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        '200':
          description: Audit entries.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/AuditEntry' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'


  /api/v1/capabilities:
    get:
      operationId: listAvailableCapabilities
      summary: What this team may bind to right now
      description: |
        The caller's own offers plus anything another team has shared with them (D42). Discovery is the
        *consequence* of a share, so revoking withdraws both at once -- an offer that cannot be bound should not
        remain in a list someone will try to bind to.
      security:
        - bearerJwt: []
      parameters:
        - { name: capability, in: query, required: false, schema: { type: string, maxLength: 60 } }
      responses:
        '200':
          description: Offers available to the caller's teams. May be empty.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/CapabilityOffer' }
        '401':
          $ref: '#/components/responses/Unauthenticated'

  /api/v1/instances/{instanceId}/capability:
    parameters:
      - { name: instanceId, in: path, required: true, schema: { type: string, minLength: 1 } }
    post:
      operationId: publishCapability
      summary: Record that this instance offers a capability to other platforms
      description: |
        Publishing is what makes an instance a shared service rather than a private one (D42): the manifest
        already declares `provides:`, and this records it so platfolio can answer questions about it. Outputs
        are names and kinds with a placement state -- there is no field for a value, and the absence is the
        rule (D4). Idempotent by (instance, capability): republishing refreshes the outputs.
      security:
        - bearerJwt: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [capability]
              properties:
                capability: { type: string, minLength: 1, maxLength: 60 }
                outputs:
                  type: array
                  maxItems: 40
                  items:
                    type: object
                    additionalProperties: false
                    required: [output, kind]
                    properties:
                      output: { type: string, minLength: 1, maxLength: 80 }
                      kind: { type: string, enum: [url, value, secret] }
                      state: { type: string, enum: [not-issued, issued-and-placed, placement-unknown, re-issue-required], default: not-issued }
            example: { capability: identity, outputs: [{ output: issuer, kind: url, state: issued-and-placed }, { output: client_secret, kind: secret }] }
      responses:
        '200':
          description: Offer recorded.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CapabilityOffer' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/instances/{instanceId}/capability/identity:
    parameters:
      - { name: instanceId, in: path, required: true, schema: { type: string, minLength: 1 } }
    put:
      operationId: publishSharedIdentityCapability
      summary: Publish the reviewed Shared Identity output contract
      description: |
        Reads the built-in Shared Identity release at the instance's saved source revision. Records output
        names and kinds. An existing compatible offer retains its recorded placement states. Publishing a
        declaration does not make a client or place a credential.
      security: [{ bearerJwt: [] }]
      responses:
        '200':
          description: The identity capability offer.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CapabilityOffer' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '503':
          description: The pinned Shared Identity source could not be read or verified.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/v1/instances/{instanceId}/capability/{capability}/shares:
    parameters:
      - { name: instanceId, in: path, required: true, schema: { type: string, minLength: 1 } }
      - { name: capability, in: path, required: true, schema: { type: string, minLength: 1, maxLength: 60 } }
    # Only PUT lives here. Revocation addresses the share itself -- see the path below -- because the
    # transport does not read a DELETE body (a body on a method whose semantics are "delete this resource"
    # invites two sources of truth), and a revoke that cannot say *which* share it means is a foot-gun.
    put:
      operationId: shareCapability
      summary: Let another team bind to this capability
      description: |
        The explicit grant behind D42. A capability that is merely reachable is not offered: without this row,
        a cross-team bind is refused, which is what stops any instance in the system from pointing at someone
        else's identity provider and being handed its configuration.
      security:
        - bearerJwt: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [toTeamId]
              properties:
                toTeamId: { type: string, minLength: 1, maxLength: 120, description: 'A team id, or `*` to offer it to every team. Recorded, never implied.' }
            example: { toTeamId: team-2f7c }
      responses:
        '200':
          description: Shared.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CapabilityShare' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/instances/{instanceId}/capability/{capability}/shares/{toTeamId}:
    parameters:
      - { name: instanceId, in: path, required: true, schema: { type: string, minLength: 1 } }
      - { name: capability, in: path, required: true, schema: { type: string, minLength: 1, maxLength: 60 } }
      - name: toTeamId
        in: path
        required: true
        schema: { type: string, minLength: 1, maxLength: 120 }
        description: The team whose grant is withdrawn, or `*` for the open offer.
    delete:
      operationId: revokeCapabilityShare
      summary: Withdraw a share without breaking the consumer that already relies on it
      description: |
        Revocation ages existing bindings to `stale` rather than deleting them (D42): a running application keeps
        working, the intent is withdrawn, and the gap becomes visible instead of silent. A deleted binding would
        leave the consumer pointing at a URL nothing recorded -- the exact failure this table exists to prevent.
      security:
        - bearerJwt: []
      responses:
        '200':
          description: Revoked.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [revoked]
                properties:
                  revoked: { type: boolean, const: true }
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/instances/{instanceId}/bindings:
    parameters:
      - { name: instanceId, in: path, required: true, schema: { type: string, minLength: 1 } }
    get:
      operationId: listBindings
      summary: What this platform consumes
      security:
        - bearerJwt: []
      responses:
        '200':
          description: Bindings, oldest first.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/BindingRecord' }
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/instances/{instanceId}/bindings/{capability}:
    parameters:
      - { name: instanceId, in: path, required: true, schema: { type: string, minLength: 1 } }
      - { name: capability, in: path, required: true, schema: { type: string, minLength: 1, maxLength: 60 } }
    put:
      operationId: bindCapability
      summary: Consume another platform's capability
      description: |
        Validated by `checkBindingPolicy` before anything is written: the offer must exist, every destination
        the consumer declares must be satisfied by an output the provider actually publishes (a binding that
        cannot fill its own variables is a broken promise, not a partial success), self-binding is refused, and
        a cross-team bind needs a live share.
      security:
        - bearerJwt: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [providerInstanceId, destinations]
              properties:
                providerInstanceId: { type: string, minLength: 1 }
                destinations:
                  type: array
                  maxItems: 40
                  items:
                    type: object
                    additionalProperties: false
                    required: [output, into]
                    properties:
                      output: { type: string, minLength: 1, maxLength: 80 }
                      into:
                        type: array
                        minItems: 1
                        maxItems: 20
                        items: { type: string, minLength: 1, maxLength: 120 }
            example: { providerInstanceId: inst-410f, destinations: [{ output: issuer, into: [OIDC_ISSUER] }] }
      responses:
        '200':
          description: Bound.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BindingRecord' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      operationId: unbindCapability
      summary: Stop consuming a capability
      description: |
        204 on success, and 404 when there was no such binding. Nothing is destroyed here -- the consumer's
        configuration is theirs to remove; this withdraws platfolio's record of the dependency.
      security:
        - bearerJwt: []
      responses:
        '204':
          description: Unbound.
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '409': { $ref: '#/components/responses/Conflict' }

  /api/v1/instances/{instanceId}/bindings/identity/intent:
    parameters:
      - { name: instanceId, in: path, required: true, schema: { type: string, minLength: 1 } }
    put:
      operationId: bindSharedIdentity
      summary: Select a Shared Identity instance for a consumer
      description: |
        Selects the same team's reviewed Shared Identity instance with a compatible offer. The server
        derives the OIDC destination names for the selected client type. The shared binding record
        protects the provider from removal. A bound record describes intent and carries no credentials
        or guarantee of runtime activation.
      security: [{ bearerJwt: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [providerInstanceId, clientType]
              properties:
                providerInstanceId: { type: string, minLength: 1, maxLength: 120 }
                clientType: { type: string, enum: [public, confidential] }
      responses:
        '200':
          description: The existing or newly recorded dependency and destination names.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BindingRecord' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/v1/instances/{instanceId}/bindings/identity/environments/{environment}:
    parameters:
      - { name: instanceId, in: path, required: true, schema: { type: string, minLength: 1 } }
      - { name: environment, in: path, required: true, schema: { type: string, enum: [production, staging] } }
    get:
      operationId: getSharedIdentityClient
      summary: Read the customer worker's credential placement status
      security: [{ bearerJwt: [] }]
      responses: &identity-client-responses
        '200':
          description: Client placement metadata. Application sign-in is verified separately.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IdentityClientPlacement' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '503':
          description: The private worker, OpenBao, pinned release source, Keycloak or Railway could not complete verification.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    put:
      operationId: placeSharedIdentityClient
      summary: Register a Keycloak client and deliver its configuration
      description: Uses the retained identity binding and the destination declarations in the consumer release. The customer can configure the application origins and administration grant inside OpenBao or provide a worker-encrypted initial setup. For a marketplace OCI install, the private worker delivers the configuration to the pinned Railway service and verifies a new deployment before reporting placed. Hosted placement can take several minutes.
      security: [{ bearerJwt: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [providerEnvironment]
              properties:
                providerEnvironment: { type: string, enum: [production, staging] }
                setup:
                  type: object
                  description: Optional initial customer configuration. Seal only the realm manager client ID and secret to the private worker key returned by the owner setup operation.
                  additionalProperties: false
                  required: [issuer, redirectUri, realmGrant]
                  properties:
                    issuer: { type: string, minLength: 1, maxLength: 1024 }
                    redirectUri: { type: string, minLength: 1, maxLength: 1024 }
                    realmGrant: { type: string, minLength: 512, maxLength: 512, pattern: '^[a-zA-Z0-9+/=]+$' }
      responses: *identity-client-responses
    delete:
      operationId: revokeSharedIdentityClient
      summary: Disable the issued client and remove its credential placement
      description: Disables the exact client, clears the runtime configuration for a marketplace OCI install, and removes its OpenBao placement before releasing the environment reservation. The consumer binding remains until explicitly detached. Hosted revocation can take several minutes.
      security: [{ bearerJwt: [] }]
      responses: *identity-client-responses

  /api/v1/instances/{instanceId}/consumers:
    parameters:
      - { name: instanceId, in: path, required: true, schema: { type: string, minLength: 1 } }
    get:
      operationId: listConsumers
      summary: What breaks if this platform is removed
      description: |
        The question the teardown issues (#106, #107) were opened to ask, which was unanswerable before #177 --
        the wiring existed only inside rendered manifests. A destroy consults this before it goes anywhere
        (D43), and a non-empty list is the reason it refuses.
      security:
        - bearerJwt: []
      responses:
        '200':
          description: Consumers of this instance's capabilities, oldest first.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/BindingRecord' }
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'

  # ---------------------------------------------------------------- redeploy
  # Added as a PATH ONLY, with every schema inline: component generation in this document is owned by another
  # change in flight, so a second writer touching `components:` would be a merge nobody would notice until the
  # generated types disagreed with the spec. If this operation survives review, its response body belongs in
  # components beside the other instance-scoped results, and the inline shape should be replaced then.
  /api/v1/instances/{instanceId}/redeploy:
    parameters:
      - name: instanceId
        in: path
        required: true
        schema: { type: string, minLength: 1 }
    post:
      operationId: redeployInstance
      summary: Restart a running service so it picks up configuration it does not hold
      description: |
        The capability this API did not have: a way to say "redeploy", separately from "apply this
        description". Measured on Railway, 2026-11-15 (`docs/research/railway-variable-value-redeploy-2026-11-15.md`,
        arms A-D against our own `api-staging`):

        - a variable written with `skipDeploys: true` started NO deployment in 120s;
        - a variable whose VALUE changed, written without that suppression, started one on its own;
        - writing the SAME value again started nothing -- the provider diffs values server-side;
        - an explicit `serviceInstanceDeploy` was visible in the deployment list, which is what makes the
          other three observations trustworthy rather than inferred.

        Two consequences, and they are why this endpoint exists in this shape.

        **1. Composition changes already work, and this is not for them.** A variable name added or removed
        moves `planHash`, and `applyPlan` deploys deliberately afterwards. That is a normal software deployment,
        exactly as intended.

        **2. A VALUE change is not detectable by platfolio, and never will be.** D4 forbids reading configuration
        back: `variables()` returns values and is refused, and `environment.config` answers names with values
        redacted. So the platform cannot answer "did this change" -- and the measurement says it does not have
        to, because the provider already knows. What platfolio can and must provide is the verb for whoever does
        know: the operator who just rotated a credential, or the `PUT …/secrets/{name}` call that wrote a new
        value and left the running container holding the old one, because Railway resolves `${{…}}` references
        at WRITE time. The gap that started this (`api-staging` booting with an empty `PLATFOLIO_DB_URL` until a
        human redeployed it, #242) is that gap.

        The tradeoff accepted, stated rather than buried: a refresh asked for when nothing actually changed still
        costs a container bounce, and the response cannot say whether it was needed. The alternative -- platfolio
        keeping a digest of every delivered value so it could diff them itself -- would store secret-derived
        material in our database, which is the D4 line this design refuses to cross. A needless restart is
        cheaper than a credential shadow.

        `service` is the LOGICAL name from the platform description (`api`), not the provider's row
        (`api-production`): the physical name is derived by the same rule everywhere (D57), and making a tenant
        name a provider artifact would leak an implementation detail into the contract. Omitted, the whole named
        environment is refreshed. Environments are never inferred from each other, and a staging name cannot
        touch a production row -- asserted in `packages/contracts/test/railway-redeploy.test.ts`.

        202, not 200: a restart is asynchronous and this call returns the REQUEST, not a settled state.
        `verified` therefore means "a new deployment was observed for every service asked about" -- read back from
        the provider's deployment identity, not from the mutation's own boolean, which is measured to be `true`
        for a call that produced no new deployment. Where it is false, `refused` and `budgetSkipped` say which
        names did not move: a refresh that restarted half an environment must not read as success.

        Member-level authority, not owner-level: a member may already deploy the platform (D43), and a restart
        grants nothing new. Writing the VALUE stays owner-only and lives at `PUT …/secrets/{name}`.
      security:
        - bearerJwt: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [environment]
              properties:
                environment: { type: string, minLength: 1, enum: [production, staging, preview] }
                service: { type: string, minLength: 1, maxLength: 120 }
      responses:
        '202':
          description: Restart requested for the named environment; per-service outcome reported by physical name.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [instanceId, environment, services, refused, budgetSkipped, verified]
                properties:
                  instanceId: { type: string }
                  environment: { type: string }
                  services:
                    type: array
                    description: Physical names the provider was asked to redeploy, in the order it acted.
                    items: { type: string }
                  refused:
                    type: array
                    description: Names it could not act on -- no such service, no instance here, or a deploy the provider accepted without starting.
                    items:
                      type: object
                      additionalProperties: false
                      required: [service, code, reason]
                      properties:
                        service: { type: string }
                        code:
                          type: string
                          enum: [no-project, no-environment, no-service, not-in-environment, deployment-unchanged]
                        reason: { type: string }
                  budgetSkipped:
                    type: array
                    description: 'Names suppressed because the provider''s deploy ceiling was already spent. Distinct from `refused`: this is "not allowed to", not "nothing there".'
                    items: { type: string }
                  verified:
                    type: boolean
                    description: True only when every service asked about was observed to have a NEW deployment id.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '501':
          description: The selected provider cannot restart a service; the operation is absent from its advertised set.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [error, message]
                properties:
                  error: { type: string, const: provider-cannot-redeploy }
                  message: { type: string }
        '502':
          description: The provider refused. Its words are forwarded, redacted -- the only evidence available.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }


  /api/v1/teams/{teamId}/marketplace/installation-offer:
    parameters:
      - { name: teamId, in: path, required: true, schema: { type: string } }
    get:
      operationId: getHubInstallationOffer
      summary: Read the available private Platfolio installer
      security: [{ bearerJwt: [] }]
      responses:
        '200':
          description: An installation provider and its pinned release.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [provider, revision]
                properties:
                  provider: { type: string, minLength: 1 }
                  revision: { type: string, pattern: '^[0-9a-f]{40}$' }
                  managedFirstSignIn: { type: boolean }
        '404': { $ref: '#/components/responses/NotFound' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '401': { $ref: '#/components/responses/Unauthenticated' }

  /api/v1/teams/{teamId}/marketplace/installation-launches:
    parameters:
      - { name: teamId, in: path, required: true, schema: { type: string } }
    get:
      operationId: listHubInstallationLaunches
      summary: List the owner's private installation journals
      security: [{ bearerJwt: [] }]
      responses:
        '200':
          description: Recorded private installations and available recovery actions.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/HubInstallationJournal' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      operationId: authorizeHubInstallation
      summary: Begin a short-lived authorization for a new or recorded installation
      security: [{ bearerJwt: [] }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [installationId]
              properties:
                installationId: { type: string, format: uuid }
      responses:
        '400': { $ref: '#/components/responses/BadRequest' }
        '201':
          description: The provider authorization URL and the launch it belongs to.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [id, authorizationUrl]
                properties:
                  id: { type: string, format: uuid }
                  authorizationUrl: { type: string, format: uri }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/v1/teams/{teamId}/marketplace/installation-launches/{launchId}:
    parameters:
      - { name: teamId, in: path, required: true, schema: { type: string } }
      - { name: launchId, in: path, required: true, schema: { type: string, format: uuid } }
    delete:
      operationId: forgetHubInstallation
      summary: Delete the owner's verified-removed installation record
      security: [{ bearerJwt: [] }]
      responses:
        '204': { description: The removed installation record was deleted. }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    get:
      operationId: getHubInstallationLaunch
      summary: Read the owner's installation launch progress
      security: [{ bearerJwt: [] }]
      responses:
        '200':
          description: Safe launch progress. Provider grants and setup credentials are never returned.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HubInstallationLaunch' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      operationId: startHubInstallation
      summary: Create the project in one approved workspace with the selected environments
      security: [{ bearerJwt: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InstallationLaunchInput'
      responses:
        '202':
          description: The launch was accepted for execution.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HubInstallationLaunch' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/v1/teams/{teamId}/marketplace/installation-launches/{launchId}/first-sign-in/{environment}:
    parameters:
      - { name: teamId, in: path, required: true, schema: { type: string, minLength: 1 } }
      - { name: launchId, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: environment, in: path, required: true, schema: { type: string, enum: [staging, production] } }
    get:
      operationId: getHubInstallationFirstSignIn
      summary: Reveal the launch owner's still-active first sign-in password
      description: Reveals the one-time password only while private Keycloak requires the initial password change. Responses must never be cached.
      security: [{ bearerJwt: [] }]
      responses:
        '200':
          description: Temporary password for the local owner.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [temporaryPassword]
                properties:
                  temporaryPassword: { type: string, pattern: '^[A-Za-z0-9_-]{43}$' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { description: The private installation could not confirm the password is still active. }

  /api/v1/teams/{teamId}/marketplace/installation-launches/{launchId}/maintenance:
    parameters:
      - { name: teamId, in: path, required: true, schema: { type: string, minLength: 1 } }
      - { name: launchId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: maintainHubInstallation
      summary: Update one installed environment or remove the recorded installation and its storage
      security: [{ bearerJwt: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  additionalProperties: false
                  required: [action, environment, revision]
                  properties:
                    action: { type: string, enum: [update] }
                    environment: { type: string, enum: [staging, production] }
                    revision: { type: string, pattern: '^[0-9a-f]{40}$' }
                - type: object
                  additionalProperties: false
                  required: [action, confirmation]
                  properties:
                    action: { type: string, enum: [wipe] }
                    confirmation: { type: string, minLength: 2, maxLength: 63 }
      responses:
        '202':
          description: The operation was accepted for execution. Read the journal for the verified outcome.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HubInstallationLaunch' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/v1/hosting/installation-authorization/callback:
    get:
      operationId: completeHubInstallationAuthorization
      summary: Complete provider authorization for a single pending installation launch
      security: []
      parameters:
        - { name: state, in: query, schema: { type: string } }
        - { name: code, in: query, schema: { type: string } }
        - { name: iss, in: query, schema: { type: string } }
        - { name: error, in: query, schema: { type: string } }
      responses:
        '303':
          description: Return to the configured Platfolio site without forwarding authorization data.
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/teams/{teamId}/marketplace/releases:
    parameters:
      - { name: teamId, in: path, required: true, schema: { type: string } }
    post:
      operationId: publishMarketplaceRelease
      summary: Publish an immutable free template release on the hub
      description: Restricted to owners of the configured hub publisher team. Repeating the same publication is idempotent.
      security: [{ bearerJwt: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MarketplaceReleasePublication'
      responses:
        '204': { description: The release is published. }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: This version has already been published with a different pin.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '503':
          description: The source repository could not be read.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /api/v1/teams/{teamId}/marketplace/platforms:
    parameters:
      - { name: teamId, in: path, required: true, schema: { type: string } }
    post:
      operationId: createMarketplacePlatform
      summary: Create a marketplace platform owned by the publishing team
      description: The listing becomes public on its first release. Only a team owner can create it.
      security: [{ bearerJwt: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MarketplacePlatformCreation' }
      responses:
        '201':
          description: The newly created listing.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MarketplacePublisherPlatform' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/v1/teams/{teamId}/marketplace/platforms/{platformId}/releases:
    parameters:
      - { name: teamId, in: path, required: true, schema: { type: string } }
      - { name: platformId, in: path, required: true, schema: { type: string, minLength: 1, maxLength: 128 } }
    post:
      operationId: publishMarketplacePlatformRelease
      summary: Publish an immutable release of a team-owned platform
      description: A retry of the same version and coordinates returns the same release summary. A version cannot be repinned.
      security: [{ bearerJwt: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MarketplacePlatformPublication' }
      responses:
        '200':
          description: The release summary and the digest required for an exact acquisition.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MarketplacePlatformRelease' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/v1/teams/{teamId}/marketplace/platforms/{platformId}/uploads:
    parameters: &marketplace-publisher-params
      - { name: teamId, in: path, required: true, schema: { type: string } }
      - { name: platformId, in: path, required: true, schema: { type: string } }
    post:
      operationId: issueMarketplaceUploadGrant
      summary: Authorize an OCI push to a publisher release namespace
      security: [{ bearerJwt: [] }]
      requestBody: &marketplace-version-request
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MarketplaceArtifactVersion' }
      responses:
        '200': &marketplace-grant-response
          description: Short-lived registry credentials scoped to the requested version.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MarketplaceArtifactGrant' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': &marketplace-artifact-unavailable
          description: Release artifact delivery is unavailable.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/v1/teams/{teamId}/marketplace/platforms/{platformId}/bundles:
    parameters: *marketplace-publisher-params
    post:
      operationId: publishMarketplaceArtifactBundle
      summary: Publish an immutable deployment recipe and OCI image set
      security: [{ bearerJwt: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MarketplaceBundlePublication' }
      responses:
        '200':
          description: Catalog summary of the verified release.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MarketplacePlatformRelease' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '503': *marketplace-artifact-unavailable

  /api/v1/teams/{teamId}/marketplace/platforms/{platformId}/maintenance:
    parameters: *marketplace-publisher-params
    put:
      operationId: setMarketplaceMaintenance
      summary: Set a buyer team's eligibility for new maintained releases
      security: [{ bearerJwt: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MarketplaceMaintenanceInput' }
      responses:
        '204': { description: Eligibility was recorded for this platform. }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': *marketplace-artifact-unavailable

  /api/v1/teams/{teamId}/marketplace/installations:
    parameters:
      - { name: teamId, in: path, required: true, schema: { type: string } }
    get:
      operationId: listMarketplaceInstallations
      summary: List the team's private installation connections
      description: Exposes connection state to team owners. Enrollment codes and registry credentials are excluded.
      security: [{ bearerJwt: [] }]
      responses:
        '200':
          description: The team's installation IDs and connection states.
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/MarketplaceInstallation' } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/teams/{teamId}/marketplace/installations/{installationId}:
    parameters:
      - { name: teamId, in: path, required: true, schema: { type: string } }
      - { name: installationId, in: path, required: true, schema: { type: string, format: uuid } }
    put:
      operationId: connectMarketplaceInstallation
      summary: Link a customer installation to this team
      description: A team owner approves a link. A disconnected installation ID cannot be reactivated.
      security: [{ bearerJwt: [] }]
      responses:
        '204': { description: The installation is linked. }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      operationId: disconnectMarketplaceInstallation
      summary: Disconnect an installation from marketplace access
      description: Existing deployments and acquired releases remain with the customer.
      security: [{ bearerJwt: [] }]
      responses:
        '204': { description: The installation is disconnected. }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/teams/{teamId}/marketplace/installations/{installationId}/claim:
    parameters:
      - { name: teamId, in: path, required: true, schema: { type: string } }
      - { name: installationId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: claimFreeMarketplaceRelease
      summary: Claim the pinned free starter release for a linked installation
      security: [{ bearerJwt: [] }]
      responses:
        '200': &marketplace-claim-response
          description: A receipt containing the immutable template source coordinates.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [installationId, template, repo, version, revision, priceMinor]
                properties:
                  installationId: { type: string, format: uuid }
                  template: { type: string, enum: [starter-web] }
                  repo: { type: string }
                  version: { type: string }
                  revision: { type: string, pattern: '^[a-f0-9]{40}$' }
                  priceMinor: { type: integer, enum: [0] }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/teams/{teamId}/marketplace/installations/{installationId}/enrollment:
    parameters:
      - { name: teamId, in: path, required: true, schema: { type: string } }
      - { name: installationId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: issueMarketplaceEnrollment
      summary: Authorize a private installation to enroll with the hub
      description: The team owner receives an expiring code once. Issuing again replaces a pending code. An enrolled or disconnected ID cannot be issued another code.
      security: [{ bearerJwt: [] }]
      responses:
        '201':
          description: A code to present to the hub enrollment endpoint before it expires.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [enrollmentCode, expiresAt]
                properties:
                  enrollmentCode: { type: string, pattern: '^[A-Za-z0-9_-]{43}$' }
                  expiresAt: { type: string, format: date-time }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/marketplace/installations/{installationId}/enrollment:
    parameters:
      - { name: installationId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: redeemMarketplaceEnrollment
      summary: Redeem a one-use hub enrollment code
      description: The installation generates and keeps its own random credential. It sends only its SHA-256 verifier when redeeming. An expired, replaced, redeemed, or disconnected code cannot authorize an installation.
      security: [{ marketplaceCredential: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [registryDigest]
              properties:
                registryDigest: { type: string, pattern: '^[a-f0-9]{64}$' }
      responses:
        '204': { description: The installation is enrolled and may use its credential for registry requests. }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/marketplace/installations/{installationId}/claim:
    parameters:
      - { name: installationId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: claimEnrolledMarketplaceRelease
      summary: Claim the pinned free starter from the private installation
      description: This credential authorizes registry claims for one installation. It cannot act as a team member or authorize deployment or provider operations.
      security: [{ marketplaceCredential: [] }]
      responses:
        '200': *marketplace-claim-response
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/marketplace/installations/{installationId}/catalog:
    parameters:
      - { name: installationId, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: format, in: query, schema: { type: string, enum: [releases] }, description: Send releases to include versions published after the bundled catalog. }
    post:
      operationId: getEnrolledMarketplaceCatalog
      summary: Read the pinned registry catalog using an installation grant
      security: [{ marketplaceCredential: [] }]
      responses:
        '200':
          description: Registered releases and their availability in the installer.
          content:
            application/json:
              schema: *marketplace-catalog
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/marketplace/installations/{installationId}/acquisitions:
    parameters:
      - { name: installationId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: acquireMarketplacePlatformRelease
      summary: Acquire an exact free release for an enrolled installation's team
      description: The hub resolves the team from the enrollment. A receipt includes the pinned artifact coordinates and grants no provider authority.
      security: [{ marketplaceCredential: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MarketplacePlatformAcquisitionInput' }
      responses:
        '200':
          description: The team's durable receipt and exact release descriptor. A retry returns the same receipt.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MarketplacePlatformAcquisition' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '503':
          description: The hub could not read the selected release or record the acquisition.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/v1/marketplace/installations/{installationId}/bundle-acquisitions:
    parameters:
      - { name: installationId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: acquireMarketplaceArtifactRelease
      summary: Acquire a free or maintained OCI bundle
      security: [{ marketplaceCredential: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MarketplacePlatformAcquisitionInput' }
      responses:
        '200':
          description: The durable acquisition and its pinned deployment bundle.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MarketplaceArtifactAcquisition' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '503': *marketplace-artifact-unavailable

  /api/v1/marketplace/installations/{installationId}/pulls:
    parameters:
      - { name: installationId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: issueMarketplacePullGrant
      summary: Authorize downloading the artifacts covered by a saved acquisition
      security: [{ marketplaceCredential: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MarketplacePlatformAcquisitionInput' }
      responses:
        '200': *marketplace-grant-response
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': *marketplace-artifact-unavailable

  /api/v1/teams/{teamId}/marketplace/installs:
    parameters:
      - { name: teamId, in: path, required: true, schema: { type: string } }
    post:
      operationId: preparePrivateMarketplaceInstall
      summary: Verify and retain an acquired release on a private installation
      description: An image install can be provisioned by applying its retained hosting plan. A starter install returns the customer repository pin for the source workflow. Retrying an exact selection under the same name returns the retained installation.
      security: [{ bearerJwt: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MarketplaceInstallInput' }
      responses:
        '200':
          description: The local instance and associated acquisition receipt ID.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MarketplaceInstall' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '503':
          description: The private worker, artifact source or storage is unavailable.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/v1/teams/{teamId}/marketplace/connection:
    parameters:
      - { name: teamId, in: path, required: true, schema: { type: string } }
    get:
      operationId: getPrivateMarketplaceConnection
      summary: Check the private installation's marketplace connection
      security: [{ bearerJwt: [] }]
      responses:
        '200':
          description: Connection state and any pinned release acquired by this installation.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [state]
                properties:
                  state: { type: string, enum: [unconfigured, openbao-required, disconnected, connected, unavailable] }
                  release:
                    type: object
                    additionalProperties: false
                    required: [template, version, revision]
                    properties:
                      template: { type: string }
                      version: { type: string }
                      revision: { type: string, pattern: '^[0-9a-f]{40}$' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503':
          description: The private installation worker is unavailable.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    post:
      operationId: enrollPrivateMarketplaceConnection
      summary: Exchange a one-use hub handoff and acquire the pinned free release
      security: [{ bearerJwt: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [handoff]
              properties:
                handoff: { type: string, pattern: '^[0-9a-f-]{36}:[A-Za-z0-9_-]{43}$' }
      responses:
        '204': { description: The worker verified the connection and saved the release. }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: The handoff was refused or there is already a connected installation.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '503':
          description: The worker, OpenBao or the marketplace could not complete enrollment.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/v1/teams/{teamId}/starter-launch/setup:
    parameters:
      - { name: teamId, in: path, required: true, schema: { type: string } }
    get:
      operationId: getStarterLaunchSetup
      summary: Read the customer worker, OpenBao and Railway connection readiness
      security: [{ bearerJwt: [] }]
      responses:
        '200':
          description: Current readiness and the worker public encryption key. The Railway connection requires a usable or refreshable authorization. Older OpenBao policies can be updated separately from normal vault setup.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [openBao, railway, workerKey]
                properties:
                  openBao: { type: string, enum: [unreachable, uninitialized, sealed, setup-required, ready] }
                  railway: { type: string, enum: [connect, connected] }
                  workerKey: { type: string }
                  canWipeData: { type: boolean }
