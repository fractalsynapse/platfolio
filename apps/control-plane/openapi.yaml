openapi: 3.1.0
info:
  title: platfolio control-plane API
  version: 0.1.0
  description: |
    The control plane's public HTTP surface. **This file is the validation mechanism, not documentation**
    (D41): `pnpm run api:check` fails if a handler exists without an operation here, if an operation here has
    no route, or if a response body does not validate against its schema below.

    Scope of this revision is [16 § Slice 1](../docs/design/16-foundation-build-order.md): liveness, the
    build identity, and one authenticated operation that proves token **verification** rather than token
    parsing. Instance, team, dispatch and secret operations are deliberately absent — they arrive with the
    records that make them truthful, and an API designed before its data model is a description of a hope.

    What authenticated means here: a bearer JWT whose signature, `iss`, `aud`, `exp`/`nbf` and `sub` have been
    checked against JWKS pinned to the configured issuer (the `identity.provider` seam, docs/design/10). A
    token that merely decodes is unauthenticated, and a claim of identity from one is the failure mode this
    whole slice exists to make impossible.

    The secret rule holds here too (D4): no operation accepts, returns or echoes a secret **value**. Names,
    presence and provenance only, from the API up.

    Cross-origin calls are **not in this document, deliberately**. A CORS preflight — `OPTIONS` carrying
    `Access-Control-Request-Method` — presents no credential, matches no operation and has no response schema a
    client may depend on: it is transport negotiation, like `Content-Length`. `operationsOf` reads every method
    key under a path as an operation, so one `options:` entry per path would add ~30 phantom endpoints to the
    contract, to `ROUTE_MANIFEST` and to the policy table in order to describe something no caller is permitted
    to call directly. It is answered in the HTTP transport instead (`packages/kernel/src/cors.ts`), which grants a
    preflight only for a method the route table really registers for that path. Two things *are* for a client
    author: this API authenticates with `Authorization: Bearer` and never with cookies, so
    `Access-Control-Allow-Credentials` is not sent and a UI must present its own token; and which browser origins
    may call at all is deployment configuration — `PLATFOLIO_ALLOWED_ORIGINS`, unset meaning same-origin only.

    **Shared shapes are generated, not typed here.** The components marked `# GENERATED` in
    `components.schemas` are written by `pnpm run spec:gen` from the StandardSchema definitions in
    `packages/contracts` (#247), so the document is a build artifact for those shapes: changing one means
    changing the definition, and `pnpm run spec:check` fails the build if the committed text is not what the
    schemas produce. The prose a schema cannot state -- field descriptions, `format: date-time`, examples --
    lives in `packages/api-contract/src/spec-annotations.ts`, keyed by component and property path, which is
    the only place it can be edited without being undone. `paths:`, security, responses and the components
    with no code-side definition (`Slug`, `CurrentPerson`, `Health`, `Ready`, `ReadinessCheck`,
    `TeamWithRole`, `Version`, `Whoami`, `Error`) stay hand-written, and are listed with a reason in
    `UNMATCHED_COMPONENTS`.

    A private installation with email setup enabled returns HTTP 503 with error
    `private-smtp-required` for workspace operations until its owner verifies the relay.
    Health, identity and setup endpoints are available during onboarding.

  contact:
    name: platfolio
servers:
  - url: http://localhost:8080
    description: local Compose stack (docker compose up — Postgres, Keycloak, control-plane)
tags:
  - name: operational
    description: Unauthenticated liveness and build identity. Safe to probe; carries no tenant data.
  - name: identity
    description: Operations that require a verified token.

paths:
  /status:
    get:
      operationId: getStatus
      tags: [operational]
      summary: Check that the API is serving requests
      description: Fixed liveness response for deployment probes.
      security: []
      responses:
        '200':
          description: The API is serving requests.
          headers:
            Cache-Control:
              schema: { type: string, enum: [no-store] }
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [status]
                properties:
                  status: { type: string, enum: [ok] }
              example: { status: ok }

  /healthz:
    get:
      operationId: getHealth
      tags: [operational]
      summary: Liveness
      description: |
        Fixed payload on purpose: an operator can compare instances without reading a value that varies per
        deployment. `livenessToken` is a digest of commit and version — it identifies the build without
        exposing the version string in environments where that is unwanted, and it is not a credential.
      security: []
      responses:
        '200':
          description: Process is up.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }
              example: { status: ok, livenessToken: c914f7c467eeb7e4 }

  /readyz:
    get:
      operationId: getReady
      tags: [operational]
      summary: Readiness, per dependency, with honest absence
      description: |
        Every declared dependency reports one of `ok`, `degraded`, `failed`, or `not-configured`. The last is
        not a synonym for `ok`: a control plane that starts happily without its database is how a deployment
        reaches a green dashboard and a red reality. `status` is `ready` only when no check is `failed`, and
        a `degraded` check must carry a `detail` a human can act on.

        This endpoint answers 503 when not ready, so a load balancer can act on it.
      security: []
      responses:
        '200':
          description: Ready to serve.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Ready' }
        '503':
          description: 'Not ready. Same shape, with status not-ready and the failing or degraded checks named.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Ready' }

  /version:
    get:
      operationId: getVersion
      tags: [operational]
      summary: Report the release version, build commit and provider contract
      description: |
        The release version is the SemVer tag on the running build's exact source commit.
        Untagged candidates report null and are identified by their commit.
      security: []
      responses:
        '200':
          description: Build identity.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Version' }

  /api/v1/setup:
    get:
      operationId: getPrivateSetup
      summary: Discover whether the private installation is ready for normal use
      description: Reports setup flags for this installation without exposing identity or mail settings.
      security: []
      responses:
        '200':
          description: Installation setup requirements.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [smtpRequired, smtpConfigured, temporaryPasswordActive]
                properties:
                  smtpRequired: { type: boolean }
                  smtpConfigured: { type: boolean }
                  temporaryPasswordActive: { type: boolean }
        '503': { description: Private identity setup status is unavailable. }

  /api/v1/teams/{teamId}/setup/smtp:
    parameters:
      - { name: teamId, in: path, required: true, schema: { type: string, minLength: 1 } }
    put:
      operationId: configurePrivateSmtp
      summary: Verify and configure the private owner's SMTP relay
      description: Requires the local owner. Sends a test message before enabling account recovery. The relay password is written only to local Keycloak.
      security: [{ bearerJwt: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [host, port, user, password, from]
              properties:
                host: { type: string, minLength: 1, maxLength: 253, pattern: '^[a-zA-Z0-9][a-zA-Z0-9.\-]*$' }
                port: { type: integer, minimum: 1, maximum: 65535 }
                user: { type: string, minLength: 1, maxLength: 254 }
                password: { type: string, minLength: 1, maxLength: 1024, writeOnly: true }
                from: { type: string, format: email, maxLength: 254 }
      responses:
        '204': { description: SMTP accepted the test message and private Keycloak accepted the settings. }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { description: Could not verify or configure the relay. }

  /api/v1/auth/hub:
    get:
      operationId: getHubSignIn
      summary: Discover enabled hub sign-in for this private installation
      security: []
      responses:
        '200':
          description: Whether this installation accepts a configured hub identity. The issuer and client are published only when enabled.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [enabled]
                properties:
                  enabled: { type: boolean }
                  issuer: { type: string, format: uri }
                  clientId: { type: string, minLength: 1 }
                  scope: { type: string, minLength: 1 }
        '503':
          description: The private installation could not confirm its local sign-in setting.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/v1/teams/{teamId}/hub-sign-in:
    parameters:
      - { name: teamId, in: path, required: true, schema: { type: string } }
    put:
      operationId: updateHubSignIn
      summary: Enable or disable the configured hub for private sign-in
      description: A private workspace owner authenticated by the local issuer controls this setting. The installation configures the trusted issuer and its dedicated client outside this request.
      security: [{ bearerJwt: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [enabled]
              properties:
                enabled: { type: boolean }
      responses:
        '204': { description: The setting was saved. }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/v1/me/hub-identity:
    put:
      operationId: linkMyHubIdentity
      summary: Link a verified hub identity to the signed-in local account
      description: The local identity must already be a member of this private workspace. Both access tokens must verify independently. The operation grants no membership or role and never links by email.
      security: [{ bearerJwt: [], hubIdentityProof: [] }]
      responses:
        '204': { description: The proof was linked or already belonged to this account. }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/v1/me/hub-identity/{subject}:
    parameters:
      - { name: subject, in: path, required: true, schema: { type: string, minLength: 1 } }
    delete:
      operationId: unlinkMyHubIdentity
      summary: Revoke a linked hub identity using the local account
      security: [{ bearerJwt: [] }]
      responses:
        '204': { description: The caller's hub proof is absent. The local identity and roles remain. }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/whoami:
    get:
      operationId: getWhoami
      tags: [identity]
      summary: Echo the claims of the verified token — the smallest proof that verification works
      description: |
        Returns the claims **after** signature and validity checks, not the parsed payload. Two properties
        make this endpoint worth having at all:

        - A forged, expired, wrong-audience, wrong-issuer or signature-mismatched token yields **401**, not a
          body. An endpoint that decodes and echoes would pass a naive test and be the weakest link in the
          platform, which is precisely the mistake #159 documents for the runner path.
        - The `sub` here is a platfolio-user subject from platfolio's own realm. It is never accepted as, and
          never carries, authority over tenant infrastructure: platfolio-user identity and tenant identity do
          not share a realm, audience or token (docs/design/05). A token for this API must be useless against
          a tenant's provider — and `tenantAuthority: false` states that refusal as data rather than as policy.

        Echoed claims are allow-listed. Unknown claim names are not returned, so a token cannot use this API to
        smuggle content into a log or a UI.
      security:
        - bearerJwt: []
      responses:
        '200':
          description: Verified identity.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Whoami' }
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          description: Token verified but lacks a required scope for this operation.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: insufficient-scope, message: 'token lacks the platfolio.user scope' }

  /api/v1/me:
    get:
      operationId: getCurrentPerson
      summary: The person behind this token, their proofs, and their teams
      description: |
        The CLI needs this before anything else: `platfolio login` ends by asking who the platform thinks I
        am (#177, D44). A person may hold several proofs -- this realm, a tenant IdP later -- and the answer
        lists them without ever exposing a token, plus the teams each membership grants.

        Note what is absent: no email taken from the request, no team chosen by the caller. The issuer and
        subject come from the verified claims, and teams are read from membership. A client that could name
        its own team would be asserting its own authorization.
      security:
        - bearerJwt: []
      responses:
        '200':
          description: The authenticated person.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CurrentPerson' }
              example: { personId: person-1f7c, kind: human, identities: [{ issuer: 'http://localhost:8081/realms/platfolio', subject: '47c7105c' }], teams: [{ teamId: team-f4e9, name: dev-workspace, role: owner }] }
        '401':
          $ref: '#/components/responses/Unauthenticated'

  /api/v1/me/notifications:
    get:
      operationId: listMyNotifications
      summary: Read your rules and recent matching events for current memberships
      security: [{ bearerJwt: [] }]
      responses:
        '200':
          description: Saved rules and recent matching events visible in the workspace.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [rules, updates]
                properties:
                  rules: { type: array, items: { $ref: '#/components/schemas/NotificationRule' } }
                  updates:
                    type: array
                    items:
                      type: object
                      additionalProperties: false
                      required: [id, instanceId, event, at]
                      properties:
                        id: { type: string }
                        instanceId: { type: string }
                        event: { type: string, enum: [deployment-failed, app-outage, secret-updated] }
                        at: { type: string, format: date-time }
                        environment: { type: string }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/me/notification-email:
    get:
      operationId: getMyNotificationEmail
      summary: Read your email delivery preference
      security: [{ bearerJwt: [] }]
      responses:
        '200': &notification-email-preference
          description: The availability and state of email delivery for this account.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [available, enabled]
                properties:
                  available: { type: boolean }
                  enabled: { type: boolean }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '503': &notification-email-unavailable
          description: The installation could not read or update your email preference.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    put:
      operationId: updateMyNotificationEmail
      summary: Receive matching notifications at your verified primary address
      security: [{ bearerJwt: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [enabled]
              properties:
                enabled: { type: boolean }
      responses:
        '200': *notification-email-preference
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '503': *notification-email-unavailable
  /api/v1/instances/{instanceId}/notification-rules:
    parameters:
      - { name: instanceId, in: path, required: true, schema: { type: string } }
    post:
      operationId: createNotificationRule
      summary: Follow an app event for all environments or one selected environment
      security: [{ bearerJwt: [] }]
      requestBody: &notification-rule-body
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [event, enabled]
              properties:
                event: { type: string, enum: [deployment-failed, app-outage, secret-updated] }
                enabled: { type: boolean }
                environment: { type: string, minLength: 1, maxLength: 60 }
      responses:
        '201': &notification-rule-saved
          description: Rule saved for the signed-in person.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotificationRule' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': &notification-rule-conflict
          description: A rule already follows this event and scope.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /api/v1/instances/{instanceId}/notification-rules/{ruleId}:
    parameters:
      - { name: instanceId, in: path, required: true, schema: { type: string } }
      - { name: ruleId, in: path, required: true, schema: { type: string } }
    put:
      operationId: updateNotificationRule
      summary: Update or pause one of your own rules on this app
      security: [{ bearerJwt: [] }]
      requestBody: *notification-rule-body
      responses:
        '200': *notification-rule-saved
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': *notification-rule-conflict
    delete:
      operationId: deleteNotificationRule
      summary: Remove one of your own rules on this app
      security: [{ bearerJwt: [] }]
      responses:
        '204': { description: The rule has been removed. }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/me/profile:
    get:
      operationId: getAccountProfile
      summary: Read the signed-in operator's account profile
      security: [{ bearerJwt: [] }]
      responses:
        '200': &account-profile
          description: Profile fields read from the operator identity provider.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [username, displayName, email, emailVerified]
                properties:
                  username: { type: string }
                  displayName: { type: string }
                  email: { type: string }
                  emailVerified: { type: boolean }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '503':
          description: The issuer's user-scoped account API is unavailable.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    put:
      operationId: updateAccountProfile
      summary: Change the signed-in operator's username and display name
      description: The operation uses the caller's own account permission. Email ownership and password changes are separate identity operations.
      security: [{ bearerJwt: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [username, displayName]
              properties:
                username: { type: string, minLength: 3, maxLength: 255 }
                displayName: { type: string, minLength: 1, maxLength: 100 }
      responses:
        '200': *account-profile
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '503':
          description: The issuer's user-scoped account API is unavailable.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/v1/teams/{teamId}/invitations:
    parameters:
      - { name: teamId, in: path, required: true, schema: { type: string, minLength: 1 } }
    get:
      operationId: listInvitations
      summary: Pending and historic invitations for a team
      description: |
        Owner-only, and deliberately so: a pending invitation carries an email address, and showing that to
        every member turns a workspace into a people directory nobody asked for.
      security:
        - bearerJwt: []
      responses:
        '200':
          description: The team's invitations, newest first.
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Invitation' } }
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      operationId: createInvitation
      summary: Invite a person by address, and send the mail that tells them
      description: |
        An invitation is an intent that someone should become a member (D44). It is NOT a membership: no
        person row, no identity, and no role exists until that address is asserted by an identity provider
        and the invitation is accepted.

        The response separates two things that are easy to conflate -- whether the record was created, and
        whether the transport took the message. A created invitation whose mail failed is still an invitation
        (the row records the failure), and returning 500 for it would lose the fact that someone was invited.
      security:
        - bearerJwt: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email]
              properties:
                email: { type: string, minLength: 3, maxLength: 320 }
                role: { type: string, enum: [owner, member], default: member }
                ttlDays: { type: integer, minimum: 1, maximum: 90, default: 14 }
            example: { email: new-hire@example.com, role: member }
      responses:
        '201':
          description: Invited. Delivery is reported, not assumed.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [invitation, delivery]
                properties:
                  invitation: { $ref: '#/components/schemas/Invitation' }
                  delivery:
                    type: object
                    additionalProperties: false
                    required: [sent]
                    properties:
                      sent: { type: boolean }
                      reason: { type: string, maxLength: 300 }
              example: { invitation: { id: inv-1, teamId: team-1, email: new-hire@example.com, role: member, state: pending, invitedBy: person-1, createdAt: '2026-11-12T00:00:00.000Z', expiresAt: '2026-11-26T00:00:00.000Z' }, delivery: { sent: true } }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: A pending invitation for that address already exists in this team.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/v1/teams/{teamId}/invitations/{invitationId}:
    parameters:
      - { name: teamId, in: path, required: true, schema: { type: string, minLength: 1 } }
      - { name: invitationId, in: path, required: true, schema: { type: string, minLength: 1 } }
    delete:
      operationId: revokeInvitation
      summary: Withdraw a pending invitation
      description: |
        An accepted invitation cannot be revoked, because at that point it is a membership: remove the member
        instead. Two different verbs for two different states, so a caller cannot accidentally do the other
        thing.
      security:
        - bearerJwt: []
      responses:
        '204':
          description: Withdrawn, with no body.
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: The invitation is already accepted, revoked or expired.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/v1/me/invitations:
    get:
      operationId: listMyInvitations
      summary: Invitations addressed to the email my identity provider asserts
      description: |
        The claim path, and the reason there is no token in an invitation. The address is read from verified
        claims -- never from the request -- so a forwarded invitation email grants its reader nothing. What
        they can do is sign in with an identity that asserts the same address.
      security:
        - bearerJwt: []
      responses:
        '200':
          description: Pending, unexpired invitations for this verified address, with the team name for display before joining.
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Invitation' } }
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '409':
          description: |
            The identity behind this token asserts no verified address, so there is nothing to match against.
            Stated rather than returning an empty list, because "no invitations" and "you cannot be matched"
            are different answers and the user can act on only one of them.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/v1/me/invitations/{invitationId}/accept:
    parameters:
      - { name: invitationId, in: path, required: true, schema: { type: string, minLength: 1 } }
    post:
      operationId: acceptInvitation
      summary: Accept an invitation addressed to my verified address
      description: |
        The body is empty on purpose. Everything that decides this -- who I am, which address the IdP asserts,
        which invitation I mean -- comes from the token and the path.
      security:
        - bearerJwt: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
      responses:
        '200':
          description: A member now.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [teamId, role, personId]
                properties:
                  teamId: { type: string }
                  role: { type: string, enum: [owner, member] }
                  personId: { type: string }
              example: { teamId: team-1, role: member, personId: person-9 }
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Already accepted, withdrawn, expired, or addressed to a different verified address.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/v1/templates:
    get:
      operationId: listInstallableTemplates
      summary: List pinned free releases and installer availability
      security: [{ bearerJwt: [] }]
      responses:
