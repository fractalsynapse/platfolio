        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: The current hosting state or dependent apps prevent this operation.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '503':
          description: The instance's hosting provider is unavailable.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/v1/instances/{instanceId}/hosting/apply:
    parameters:
