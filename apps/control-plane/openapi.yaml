              schema: { $ref: '#/components/schemas/Error' }
  /api/v1/teams/{teamId}/starter-launch/openbao:
    parameters:
      - { name: teamId, in: path, required: true, schema: { type: string } }
    post:
      operationId: initializeStarterOpenBao
      summary: Initialize OpenBao and encrypt the recovery file for the owner
      security: [{ bearerJwt: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [publicKey]
