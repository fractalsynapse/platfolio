      security: [{ bearerJwt: [] }]
      responses:
        '200':
          description: The provider's observed result.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApplyResult' }
        '400':
          description: Invalid removal policy or stored plan.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: The current hosting state or dependent apps prevent this operation.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '503':
          description: The instance's hosting provider is unavailable.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/v1/instances/{instanceId}/hosting/removal:
    parameters:
      - { name: instanceId, in: path, required: true, schema: { type: string, minLength: 1 } }
    post:
      operationId: removeInstanceHosting
      summary: Stop workloads and keep storage or permanently remove the bound hosting resources
      security: [{ bearerJwt: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/HostingRemovalRequest' }
      responses:
        '200':
          description: The provider's observed result.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeleteResult' }
        '400':
          description: Invalid removal policy or stored plan.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: The current hosting state or dependent apps prevent this operation.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '503':
          description: The instance's hosting provider is unavailable.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/v1/instances/{instanceId}/environments/{environment}/configuration/starter-brand:
    parameters:
      - { name: instanceId, in: path, required: true, schema: { type: string } }
      - { name: environment, in: path, required: true, schema: { type: string } }
    get:
      operationId: getHostedStarterBrand
      summary: Read the public header label from the verified Starter Web staging app
      security: [{ bearerJwt: [] }]
      responses:
        '200':
          description: The observed public label, if available, and the current state of the app setup.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [value, state]
                properties:
                  value: { type: [string, 'null'], maxLength: 60 }
                  state: { type: string, enum: [ready, deploying, failed] }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': &starter-brand-conflict
          description: Finish the current setup or wait for the current deployment to be recorded.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '503': &starter-brand-unavailable
          description: The private worker, vault, or provider connection is unavailable.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    put:
      operationId: updateHostedStarterBrand
      summary: Deploy a public header label to the existing Starter Web staging app
      security: [{ bearerJwt: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StarterBrandChange' }
      responses:
