# platfolio's own control plane, authored as Compose (D29). The hosted platform description is this file
# plus the x-platfolio block; compose.prod.yaml is generated by the release pipeline and is not hand-edited.
#
# Locally: `docker compose -f compose.yaml -f compose.dev.yaml up --build` builds from source.
# Hosted:  the release job pins the image, generates compose.prod.yaml, and the plan derives from the merge.
name: platfolio-control-plane

services:
  status:
    # Authored file has no image: it is built from source locally, and the hosted coordinates are
    # injected by the release pipeline into compose.prod.yaml (D29). Parsing this file alone therefore
    # refuses with compose-image-unpinned -- that refusal is the design working, not a defect.
    build:
      context: ../..
      dockerfile: apps/status-api/Dockerfile
    environment:
      PLATFOLIO_VERSION: dev
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
    x-platfolio:
      public: true
      domains: [status-production-54d3.up.railway.app]
      environments: [production]

x-platfolio:
  metadata:
    name: platfolio-control-plane
    version: 0.0.0-m1step7
    title: Platfolio Control Plane
    summary: platfolio's own status and (soon) control-plane service, hosted the way it hosts tenants.
    archetype: api-service
    repository: https://github.com/fractalsynapse/platfolio
  requires:
    platfolio: ">=0.1.0 <1"
  environments:
    production: { enabled: true, branch: main }
    staging: { enabled: false }
    preview: { enabled: false }
  dns:
    ownershipVerification: txt
    apexPolicy: cname-flattening-only
  lifecycle:
    onSuspend: scale-to-zero
    onEject: [compose, data-export]
    onDelete: { graceDays: 30, backupAgeOutDays: 90 }
  release:
    buildPath: .
    dockerfile: apps/status-api/Dockerfile
    registryImage: ghcr.io/fractalsynapse/platfolio-status-api
