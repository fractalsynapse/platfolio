openapi: 3.1.0
info:
  title: platfolio control-plane API
  version: 0.1.0
  description: |
    The control plane's public HTTP surface. **This file is the validation mechanism, not documentation**
    (D41): `pnpm run api:check` fails if a handler exists without an operation here, if an operation here has
    no route, or if a response body does not validate against its schema below.

    Scope of this revision is [16 § Slice 1](../docs/design/16-foundation-build-order.md): liveness, the
    build identity, and one authenticated operation that proves token **verification** rather than token
    parsing. Instance, team, dispatch and secret operations are deliberately absent — they arrive with the
    records that make them truthful, and an API designed before its data model is a description of a hope.

    What authenticated means here: a bearer JWT whose signature, `iss`, `aud`, `exp`/`nbf` and `sub` have been
    checked against JWKS pinned to the configured issuer (the `identity.provider` seam, docs/design/10). A
    token that merely decodes is unauthenticated, and a claim of identity from one is the failure mode this
    whole slice exists to make impossible.

    The secret rule holds here too (D4): no operation accepts, returns or echoes a secret **value**. Names,
    presence and provenance only, from the API up.
  contact:
    name: platfolio
servers:
  - url: http://localhost:8080
    description: local Compose stack (docker compose up — Postgres, Keycloak, control-plane)
tags:
  - name: operational
    description: Unauthenticated liveness and build identity. Safe to probe; carries no tenant data.
  - name: identity
    description: Operations that require a verified token.

paths:
  /healthz:
    get:
      operationId: getHealth
      tags: [operational]
      summary: Liveness
      description: |
        Fixed payload on purpose: an operator can compare instances without reading a value that varies per
        deployment. `livenessToken` is a digest of commit and version — it identifies the build without
        exposing the version string in environments where that is unwanted, and it is not a credential.
      security: []
      responses:
        '200':
          description: Process is up.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }
              example: { status: ok, livenessToken: c914f7c467eeb7e4 }

  /readyz:
    get:
      operationId: getReady
      tags: [operational]
      summary: Readiness, per dependency, with honest absence
      description: |
        Every declared dependency reports one of `ok`, `degraded`, `failed`, or `not-configured`. The last is
        not a synonym for `ok`: a control plane that starts happily without its database is how a deployment
        reaches a green dashboard and a red reality. `status` is `ready` only when no check is `failed`, and
        a `degraded` check must carry a `detail` a human can act on.

        This endpoint answers 503 when not ready, so a load balancer can act on it.
      security: []
      responses:
        '200':
          description: Ready to serve.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Ready' }
        '503':
          description: 'Not ready. Same shape, with status not-ready and the failing or degraded checks named.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Ready' }

  /version:
    get:
      operationId: getVersion
      tags: [operational]
      summary: Which build this is, and which provider contract it speaks
      description: |
        The provider contract version is part of the build's identity: an operator comparing a tenant's
        instance state against a control-plane version needs to know which contract produced it
        (docs/design/02). Values come from the build environment, never from a request.
      security: []
      responses:
        '200':
          description: Build identity.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Version' }

  /api/v1/whoami:
    get:
      operationId: getWhoami
      tags: [identity]
      summary: Echo the claims of the verified token — the smallest proof that verification works
      description: |
        Returns the claims **after** signature and validity checks, not the parsed payload. Two properties
        make this endpoint worth having at all:

        - A forged, expired, wrong-audience, wrong-issuer or signature-mismatched token yields **401**, not a
          body. An endpoint that decodes and echoes would pass a naive test and be the weakest link in the
          platform, which is precisely the mistake #159 documents for the runner path.
        - The `sub` here is a platfolio-user subject from platfolio's own realm. It is never accepted as, and
          never carries, authority over tenant infrastructure: platfolio-user identity and tenant identity do
          not share a realm, audience or token (docs/design/05). A token for this API must be useless against
          a tenant's provider — and `tenantAuthority: false` states that refusal as data rather than as policy.

        Echoed claims are allow-listed. Unknown claim names are not returned, so a token cannot use this API to
        smuggle content into a log or a UI.
      security:
        - bearerJwt: []
      responses:
        '200':
          description: Verified identity.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Whoami' }
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          description: Token verified but lacks a required scope for this operation.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: insufficient-scope, message: 'token lacks the platfolio.user scope' }

  /api/v1/me:
    get:
      operationId: getCurrentPerson
      summary: The person behind this token, their proofs, and their teams
      description: |
        The CLI needs this before anything else: `platfolio login` ends by asking who the platform thinks I
        am (#177, D44). A person may hold several proofs -- this realm, a tenant IdP later -- and the answer
        lists them without ever exposing a token, plus the teams each membership grants.

        Note what is absent: no email taken from the request, no team chosen by the caller. The issuer and
        subject come from the verified claims, and teams are read from membership. A client that could name
        its own team would be asserting its own authorization.
      security:
        - bearerJwt: []
      responses:
        '200':
          description: The authenticated person.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CurrentPerson' }
              example: { personId: person-1f7c, kind: human, identities: [{ issuer: 'http://localhost:8081/realms/platfolio', subject: '47c7105c' }], teams: [{ teamId: team-f4e9, name: dev-workspace, role: owner }] }
        '401':
          $ref: '#/components/responses/Unauthenticated'

  /api/v1/teams/{teamId}/invitations:
    parameters:
      - { name: teamId, in: path, required: true, schema: { type: string, minLength: 1 } }
    get:
      operationId: listInvitations
      summary: Pending and historic invitations for a team
      description: |
        Owner-only, and deliberately so: a pending invitation carries an email address, and showing that to
        every member turns a workspace into a people directory nobody asked for.
      security:
        - bearerJwt: []
      responses:
        '200':
          description: The team's invitations, newest first.
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Invitation' } }
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      operationId: createInvitation
      summary: Invite a person by address, and send the mail that tells them
      description: |
        An invitation is an intent that someone should become a member (D44). It is NOT a membership: no
        person row, no identity, and no role exists until that address is asserted by an identity provider
        and the invitation is accepted.

        The response separates two things that are easy to conflate -- whether the record was created, and
        whether the transport took the message. A created invitation whose mail failed is still an invitation
        (the row records the failure), and returning 500 for it would lose the fact that someone was invited.
      security:
        - bearerJwt: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email]
              properties:
                email: { type: string, minLength: 3, maxLength: 320 }
                role: { type: string, enum: [owner, member], default: member }
                ttlDays: { type: integer, minimum: 1, maximum: 90, default: 14 }
            example: { email: new-hire@example.com, role: member }
      responses:
        '201':
          description: Invited. Delivery is reported, not assumed.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [invitation, delivery]
                properties:
                  invitation: { $ref: '#/components/schemas/Invitation' }
                  delivery:
                    type: object
                    additionalProperties: false
                    required: [sent]
                    properties:
                      sent: { type: boolean }
                      reason: { type: string, maxLength: 300 }
              example: { invitation: { id: inv-1, teamId: team-1, email: new-hire@example.com, role: member, state: pending, invitedBy: person-1, createdAt: '2026-11-12T00:00:00.000Z', expiresAt: '2026-11-26T00:00:00.000Z' }, delivery: { sent: true } }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: A pending invitation for that address already exists in this team.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/v1/teams/{teamId}/invitations/{invitationId}:
    parameters:
      - { name: teamId, in: path, required: true, schema: { type: string, minLength: 1 } }
      - { name: invitationId, in: path, required: true, schema: { type: string, minLength: 1 } }
    delete:
      operationId: revokeInvitation
      summary: Withdraw a pending invitation
      description: |
        An accepted invitation cannot be revoked, because at that point it is a membership: remove the member
        instead. Two different verbs for two different states, so a caller cannot accidentally do the other
        thing.
      security:
        - bearerJwt: []
      responses:
        '204':
          description: Withdrawn, with no body.
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: The invitation is already accepted, revoked or expired.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/v1/me/invitations:
    get:
      operationId: listMyInvitations
      summary: Invitations addressed to the email my identity provider asserts
      description: |
        The claim path, and the reason there is no token in an invitation. The address is read from verified
        claims -- never from the request -- so a forwarded invitation email grants its reader nothing. What
        they can do is sign in with an identity that asserts the same address.
      security:
        - bearerJwt: []
      responses:
        '200':
          description: Pending invitations for this verified address, across every team.
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Invitation' } }
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '409':
          description: |
            The identity behind this token asserts no verified address, so there is nothing to match against.
            Stated rather than returning an empty list, because "no invitations" and "you cannot be matched"
            are different answers and the user can act on only one of them.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/v1/me/invitations/{invitationId}/accept:
    parameters:
      - { name: invitationId, in: path, required: true, schema: { type: string, minLength: 1 } }
    post:
      operationId: acceptInvitation
      summary: Accept an invitation addressed to my verified address
      description: |
        The body is empty on purpose. Everything that decides this -- who I am, which address the IdP asserts,
        which invitation I mean -- comes from the token and the path.
      security:
        - bearerJwt: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
      responses:
        '200':
          description: A member now.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [teamId, role, personId]
                properties:
                  teamId: { type: string }
                  role: { type: string, enum: [owner, member] }
                  personId: { type: string }
              example: { teamId: team-1, role: member, personId: person-9 }
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Already accepted, withdrawn, expired, or addressed to a different verified address.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/v1/teams:
    get:
      operationId: listTeams
      summary: The teams this person belongs to, with the role each membership carries
      description: |
        The CLI's first screen after login (`platfolio teams list`). Derived from membership rows joined to
        teams -- never from a `teamId` a caller supplied, which would be the caller asserting its own scope.
      security:
        - bearerJwt: []
      responses:
        '200':
          description: Teams and roles. Empty for an authenticated person who belongs to nothing yet.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  additionalProperties: false
                  required: [teamId, name, role]
                  properties:
                    teamId: { type: string }
                    name: { $ref: '#/components/schemas/Slug' }
                    role: { type: string, enum: [owner, member] }
        '401':
          $ref: '#/components/responses/Unauthenticated'
    post:
      operationId: createTeam
      summary: Create a team and become its owner
      description: |
        D44's other half: in an open SaaS, adding a teammate cannot be an admin task, and creating the team in
        the first place cannot be one either. Until this existed the only way a team came into being was a seed
        script.

        The caller becomes the **owner** in the same operation, because a team nobody owns has no one who can
        invite, share, or destroy anything in it -- and no way to get out of that state. Deliberately NOT a row
        in `POLICY`: that table answers "may this person do this in that team", and here there is no team yet.
        Guarding creation is authentication plus the verified person from #177; inventing a policy entry with no
        team to apply it to would stretch the table past what it means.

        The name is the first half of every instance address (`team/name`, D45), so it is a slug, unique across
        the platform, normalised on write, and enforced in the schema, the database and the shared suite.
      security:
        - bearerJwt: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name]
              properties:
                name: { $ref: '#/components/schemas/Slug' }
            example: { name: acme }
      responses:
        '201':
          description: Created, and the caller owns it.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TeamWithRole' }
              example: { teamId: team-1f7c2b, name: acme, role: owner }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '409':
          description: That name belongs to another team. Names are platform-unique because they are addressable.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/v1/instances:
    get:
      operationId: listInstances
      summary: The caller's platforms, oldest first
      description: |
        Filtered by team membership, never returned whole. Ordered by creation, not by recency: a tenant's
        platform list should not reshuffle when something reconciles -- ordering contracts belong in the
        interface, which the store conformance suite learned the hard way.

        An authenticated caller who belongs to no team receives an empty list rather than an error, which is
        the same answer a member of an empty team gets. Distinguishing the two would leak membership.
      security:
        - bearerJwt: []
      responses:
        '200':
          description: Instances the caller's teams own. May be empty; emptiness is not an error.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Instance' }
        '401':
          $ref: '#/components/responses/Unauthenticated'
    post:
      operationId: createInstance
      summary: Begin hosting a platform
      description: |
        Creates a record; provisioning is the controllers job. An instance is not "live" because this returned
        201, and no field here implies progress -- `state` starts at `pending` and only a verified apply moves it
        (D30 law 1: an action that cannot be verified returns a reference, not a claim).
      security:
        - bearerJwt: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [teamId, name, template]
              properties:
                teamId: { type: string, minLength: 1 }
                name: { type: string, minLength: 1, maxLength: 80, pattern: '^[a-z0-9]([a-z0-9-]{0,78}[a-z0-9])?$' }
                template: { type: string, minLength: 1, description: Catalog identifier, e.g. starter-web }
                templateRef:
                  type: object
                  additionalProperties: false
                  required: [repo, commitSha]
                  properties:
                    repo: { type: string, minLength: 3, maxLength: 200 }
                    commitSha: { type: string, pattern: '^[0-9a-f]{40}$' }
            example: { teamId: team-1f7c2b, name: marketing, template: starter-web }
      responses:
        '201':
          description: Instance recorded.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Instance' }
        '400':
          description: The request did not match the schema -- names, never values.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          description: |
            No such team, or a team the caller is not a member of. One answer for both, because 403 would
            confirm the team exists (#173).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/v1/instances/{instanceId}:
    delete:
      operationId: destroyInstance
      summary: Remove the managed service -- owner-only, and refused while anything depends on it
      description: |
        The reason #176 exists. `GET /api/v1/instances/{id}/consumers` answers "what breaks if I remove this",
        and this is the verb that consults the answer before doing anything. A destroy that strands a running
        application is refused with **409 naming the consumers** -- not accepted with a warning, because an API
        that says yes to a destructive operation it knows is unsafe has made the tenant's outage its own.

        Scope, stated because the parts this does NOT touch are what a future implementer will get wrong (D36,
        extended by D43): platfolio manages the **hosted service on infrastructure the tenant owns**. It never
        deletes a repository, a branch, a workflow, or anything else in the tenant's development path. Losing a
        customer's source through a control-plane call would be unrecoverable in a way nothing here is.

        202, not 200: this records the decision and moves the state to `deprovisioning`. **Actual provider
        teardown is not wired** -- removing a Railway environment is a dispatch the action executes and attests,
        and that is execution-plane work (#196 tracks it). An endpoint reporting completed destruction it has
        not performed is the kind of lie this platform cannot tell, because a tenant reads it as licence to
        reclaim their own compute.
      security:
        - bearerJwt: []
      responses:
        '202':
          description: Removal recorded; execution follows through the dispatch path.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [instanceId, state, recorded]
                properties:
                  instanceId: { type: string }
                  state: { type: string, enum: [deprovisioning] }
                  recorded: { type: boolean, const: true }
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Something still depends on this instance.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

    parameters:
      - name: instanceId
        in: path
        required: true
        schema: { type: string, minLength: 1 }
    get:
      operationId: getInstance
      summary: One instance, as recorded
      security:
        - bearerJwt: []
      responses:
        '200':
          description: The instance.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Instance' }
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          description: No such instance for this principal.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/v1/instances/{instanceId}/plan:
    parameters:
      - name: instanceId
        in: path
        required: true
        schema: { type: string, minLength: 1 }
    put:
      operationId: putPlan
      summary: Record the desired state and the digest a runner must satisfy
      description: |
        The plan is stored with the digest `buildPlan` computed for it. The API does not re-derive a hash: a
        second implementation of a truth that has one home is the bug that made every honest attestation fail
        with 400 once already.
      security:
        - bearerJwt: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [plan]
              properties:
                plan:
                  type: object
                  description: An InfraPlan, whose own `planHash` is the authority. Carries topology and digests; never a credential value (D4).
      responses:
        '200':
          description: Stored, with the hash future dispatches will require.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [instanceId, planHash]
                properties:
                  instanceId: { type: string }
                  planHash: { type: string, pattern: '^[0-9a-f]{64}$' }
              example: { instanceId: inst-1f7c2b, planHash: '5f976b5435bf434e00000000000000000000000000000000000000000000abcd' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          description: No such instance.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/v1/instances/{instanceId}/dispatches:
    parameters:
      - name: instanceId
        in: path
        required: true
        schema: { type: string, minLength: 1 }
    post:
      operationId: createDispatch
      summary: Issue a single-use instruction for the managed workflow
      description: |
        Returns the dispatch intent the workflow passes to GitHub as inputs. The nonce is the freshness token
        the runner must echo back; the plan hash is what it must still find on the way to the provider.
      security:
        - bearerJwt: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                action: { type: string, enum: [apply, destroy], default: apply }
                environment: { type: string, minLength: 1, maxLength: 60, default: production }
            example: { action: apply, environment: production }
      responses:
        '201':
          description: Dispatch issued.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [intent]
                properties:
                  intent: { $ref: '#/components/schemas/DispatchIntent' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          description: No plan registered for this instance yet.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/v1/instances/{instanceId}/dispatches/{dispatchId}:
    parameters:
      - name: instanceId
        in: path
        required: true
        schema: { type: string, minLength: 1 }
      - name: dispatchId
        in: path
        required: true
        schema: { type: string, minLength: 1 }
    get:
      operationId: getDispatchPlan
      summary: The plan a runner is authorised to apply -- exactly once
      description: |
        Consumes the dispatch. A second read is a replay, not a retry: it answers 409 so a duplicated or
        retried GitHub job cannot apply the same plan twice. This is the property the store enforces
        conditionally in SQL, which is why it holds across processes rather than within one.
      security:
        - bearerJwt: []
      responses:
        '200':
          description: The plan and the hash it must match.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [plan, planHash, issuedAt, expiresAt]
                properties:
                  plan: { type: object }
                  planHash: { type: string, pattern: '^[0-9a-f]{64}$' }
                  issuedAt: { type: string, format: date-time }
                  expiresAt: { type: string, format: date-time }
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          description: Unknown dispatch, or a dispatch belonging to another instance.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: Already consumed -- this dispatch has a runner, or had one that died mid-apply.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/v1/attestations:
    post:
      operationId: postAttestation
      summary: A runner reports what happened
      description: |
        Accepted once per dispatch, and only if it agrees with that dispatch on nonce, plan hash, action and
        environment. Policy lives in `checkAttestationPolicy`, shared by every store implementation, because a
        security decision must not be re-implemented per driver.

        Today the caller is authenticated by a shared secret, so `actorKind` defaults to `shared-secret` rather
        than implying a verified repository binding (#159). The read-back rule is what makes a false claim
        harmless, and that is a thinner defence than it sounds like.
      security:
        - bearerJwt: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Attestation' }
      responses:
        '202':
          description: Recorded.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [accepted, dispatchId, result]
                properties:
                  accepted: { type: boolean, const: true }
                  dispatchId: { type: string }
                  result: { type: string, enum: [ok, partial, failed, noop] }
        '400':
          description: Refused by the acceptance policy, or malformed. The reason is machine-readable.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '409':
          description: This dispatch has already been attested.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/v1/instances/{instanceId}/latest-attestation:
    parameters:
      - name: instanceId
        in: path
        required: true
        schema: { type: string, minLength: 1 }
    get:
      operationId: getLatestAttestation
      summary: The most recent result for this instance, newest first
      description: |
        A claim that agrees with something is still only a claim: the control plane verifies against the
        provider before presenting it as state. This endpoint returns the record; the reconciliation is
        elsewhere on purpose.
      security:
        - bearerJwt: []
      responses:
        '200':
          description: The latest attestation.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AttestationRecord' }
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          description: Nothing has attested for this instance.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/v1/audit:
    get:
      operationId: listAudit
      summary: What the platform did to the caller's platforms, and who did it
      description: |
        Newest first, bounded by `limit`, and filtered to rows about instances the caller's teams own -- an
        audit trail is a disclosure surface. Detail carries ids and reason codes, never payloads, and never a
        credential: the store refuses an over-long detail value as a value rather than throwing, because an
        audit write that aborts the loop it is recording makes the trail less trustworthy, not more.
      security:
        - bearerJwt: []
      parameters:
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        '200':
          description: Audit entries.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/AuditEntry' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'


  /api/v1/capabilities:
    get:
      operationId: listAvailableCapabilities
      summary: What this team may bind to right now
      description: |
        The caller's own offers plus anything another team has shared with them (D42). Discovery is the
        *consequence* of a share, so revoking withdraws both at once -- an offer that cannot be bound should not
        remain in a list someone will try to bind to.
      security:
        - bearerJwt: []
      parameters:
        - { name: capability, in: query, required: false, schema: { type: string, maxLength: 60 } }
      responses:
        '200':
          description: Offers available to the caller's teams. May be empty.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/CapabilityOffer' }
        '401':
          $ref: '#/components/responses/Unauthenticated'

  /api/v1/instances/{instanceId}/capability:
    parameters:
      - { name: instanceId, in: path, required: true, schema: { type: string, minLength: 1 } }
    post:
      operationId: publishCapability
      summary: Record that this instance offers a capability to other platforms
      description: |
        Publishing is what makes an instance a shared service rather than a private one (D42): the manifest
        already declares `provides:`, and this records it so platfolio can answer questions about it. Outputs
        are names and kinds with a placement state -- there is no field for a value, and the absence is the
        rule (D4). Idempotent by (instance, capability): republishing refreshes the outputs.
      security:
        - bearerJwt: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [capability]
              properties:
                capability: { type: string, minLength: 1, maxLength: 60 }
                outputs:
                  type: array
                  maxItems: 40
                  items:
                    type: object
                    additionalProperties: false
                    required: [output, kind]
                    properties:
                      output: { type: string, minLength: 1, maxLength: 80 }
                      kind: { type: string, enum: [url, value, secret] }
                      state: { type: string, enum: [not-issued, issued-and-placed, placement-unknown, re-issue-required], default: not-issued }
            example: { capability: identity, outputs: [{ output: issuer, kind: url, state: issued-and-placed }, { output: client_secret, kind: secret }] }
      responses:
        '200':
          description: Offer recorded.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CapabilityOffer' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/instances/{instanceId}/capability/{capability}/shares:
    parameters:
      - { name: instanceId, in: path, required: true, schema: { type: string, minLength: 1 } }
      - { name: capability, in: path, required: true, schema: { type: string, minLength: 1, maxLength: 60 } }
    # Only PUT lives here. Revocation addresses the share itself -- see the path below -- because the
    # transport does not read a DELETE body (a body on a method whose semantics are "delete this resource"
    # invites two sources of truth), and a revoke that cannot say *which* share it means is a foot-gun.
    put:
      operationId: shareCapability
      summary: Let another team bind to this capability
      description: |
        The explicit grant behind D42. A capability that is merely reachable is not offered: without this row,
        a cross-team bind is refused, which is what stops any instance in the system from pointing at someone
        else's identity provider and being handed its configuration.
      security:
        - bearerJwt: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [toTeamId]
              properties:
                toTeamId: { type: string, minLength: 1, maxLength: 120, description: 'A team id, or `*` to offer it to every team. Recorded, never implied.' }
            example: { toTeamId: team-2f7c }
      responses:
        '200':
          description: Shared.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CapabilityShare' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/instances/{instanceId}/capability/{capability}/shares/{toTeamId}:
    parameters:
      - { name: instanceId, in: path, required: true, schema: { type: string, minLength: 1 } }
      - { name: capability, in: path, required: true, schema: { type: string, minLength: 1, maxLength: 60 } }
      - name: toTeamId
        in: path
        required: true
        schema: { type: string, minLength: 1, maxLength: 120 }
        description: The team whose grant is withdrawn, or `*` for the open offer.
    delete:
      operationId: revokeCapabilityShare
      summary: Withdraw a share without breaking the consumer that already relies on it
      description: |
        Revocation ages existing bindings to `stale` rather than deleting them (D42): a running application keeps
        working, the intent is withdrawn, and the gap becomes visible instead of silent. A deleted binding would
        leave the consumer pointing at a URL nothing recorded -- the exact failure this table exists to prevent.
      security:
        - bearerJwt: []
      responses:
        '200':
          description: Revoked.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [revoked]
                properties:
                  revoked: { type: boolean, const: true }
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/instances/{instanceId}/bindings:
    parameters:
      - { name: instanceId, in: path, required: true, schema: { type: string, minLength: 1 } }
    get:
      operationId: listBindings
      summary: What this platform consumes
      security:
        - bearerJwt: []
      responses:
        '200':
          description: Bindings, oldest first.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/BindingRecord' }
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/instances/{instanceId}/bindings/{capability}:
    parameters:
      - { name: instanceId, in: path, required: true, schema: { type: string, minLength: 1 } }
      - { name: capability, in: path, required: true, schema: { type: string, minLength: 1, maxLength: 60 } }
    put:
      operationId: bindCapability
      summary: Consume another platform's capability
      description: |
        Validated by `checkBindingPolicy` before anything is written: the offer must exist, every destination
        the consumer declares must be satisfied by an output the provider actually publishes (a binding that
        cannot fill its own variables is a broken promise, not a partial success), self-binding is refused, and
        a cross-team bind needs a live share.
      security:
        - bearerJwt: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [providerInstanceId, destinations]
              properties:
                providerInstanceId: { type: string, minLength: 1 }
                destinations:
                  type: array
                  maxItems: 40
                  items:
                    type: object
                    additionalProperties: false
                    required: [output, into]
                    properties:
                      output: { type: string, minLength: 1, maxLength: 80 }
                      into:
                        type: array
                        minItems: 1
                        maxItems: 20
                        items: { type: string, minLength: 1, maxLength: 120 }
            example: { providerInstanceId: inst-410f, destinations: [{ output: issuer, into: [OIDC_ISSUER] }] }
      responses:
        '200':
          description: Bound.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BindingRecord' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      operationId: unbindCapability
      summary: Stop consuming a capability
      description: |
        204 on success, and 404 when there was no such binding. Nothing is destroyed here -- the consumer's
        configuration is theirs to remove; this withdraws platfolio's record of the dependency.
      security:
        - bearerJwt: []
      responses:
        '204':
          description: Unbound.
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/instances/{instanceId}/consumers:
    parameters:
      - { name: instanceId, in: path, required: true, schema: { type: string, minLength: 1 } }
    get:
      operationId: listConsumers
      summary: What breaks if this platform is removed
      description: |
        The question the teardown issues (#106, #107) were opened to ask, which was unanswerable before #177 --
        the wiring existed only inside rendered manifests. A destroy consults this before it goes anywhere
        (D43), and a non-empty list is the reason it refuses.
      security:
        - bearerJwt: []
      responses:
        '200':
          description: Consumers of this instance's capabilities, oldest first.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/BindingRecord' }
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'


components:
  securitySchemes:
    bearerJwt:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Access token issued by platfolio's Keycloak realm. Verified against JWKS pinned to the configured
        issuer; `RS256` only, and `alg: none` or an HMAC-shaped token is refused regardless of what the
        attacker's header claims (algorithm-confusion is the reason the allowed set is checked, not assumed).

  responses:
    Forbidden:
      description: |
        The caller is a member of the team and can see the resource, but the action needs a higher role (#178).
        403 rather than the 404 used for non-members: hiding existence protects people who have no right to
        know it, and is useless advice to someone who already does.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: conflict, message: 'capability.share requires the owner role on this team' }

    NotFound:
      description: |
        No such resource, or a resource belonging to a team the caller is not a member of -- one answer for
        both, because the difference is itself information (#173).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: not-found, message: 'no such resource for this principal' }

    BadRequest:
      description: 'The request was well-formed HTTP but did not satisfy the schema: names and reasons, never values.'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: invalid-request, message: 'plan must carry the bare 64-hex planHash computed by buildPlan' }

    Unauthenticated:
      description: No token, a token that failed verification, or one that is expired or not yet valid.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: unauthenticated, message: 'token signature does not match the pinned issuer key set' }
      headers:
        WWW-Authenticate:
          description: The challenge, so a client can distinguish "no credentials" from "bad credentials".
          schema: { type: string }
          example: 'Bearer realm="platfolio", error="invalid_token"'

  schemas:
    Slug:
      type: string
      minLength: 1
      maxLength: 40
      pattern: '^[a-z0-9]([a-z0-9-]{0,38}[a-z0-9])?$'
      description: Repository-style slug. Lowercase alphanumerics with interior hyphens -- it is a URL segment and a CLI argument (D45).

    TeamWithRole:
      type: object
      additionalProperties: false
      required: [teamId, name, role]
      properties:
        teamId: { type: string, minLength: 1 }
        name: { $ref: '#/components/schemas/Slug' }
        role: { type: string, enum: [owner, member] }

    Invitation:
      type: object
      additionalProperties: false
      required: [id, teamId, email, role, state, invitedBy, createdAt, expiresAt]
      properties:
        id: { type: string, minLength: 1 }
        teamId: { type: string, minLength: 1 }
        email: { type: string, minLength: 3, maxLength: 320, description: Normalised (trimmed and case-folded) on write. }
        role: { type: string, enum: [owner, member] }
        state: { type: string, enum: [pending, accepted, revoked, expired] }
        invitedBy: { type: string, minLength: 1 }
        createdAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
        acceptedBy: { type: string }
        acceptedAt: { type: string, format: date-time }
        revokedAt: { type: string, format: date-time }
        emailReceipt: { type: string, maxLength: 200, description: The transport's receipt, so delivery is a fact about the row (D46). }
        emailError: { type: string, maxLength: 300 }

    CurrentPerson:
      type: object
      additionalProperties: false
      required: [personId, kind, identities, teams]
      properties:
        personId: { type: string, minLength: 1 }
        kind: { type: string, enum: [human, service] }
        identities:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [issuer, subject]
            properties:
              issuer: { type: string }
              subject: { type: string }
        teams:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [teamId, name, role]
            properties:
              teamId: { type: string }
              name: { type: string }
              role: { type: string, enum: [owner, member] }

    CapabilityOffer:
      type: object
      additionalProperties: false
      required: [instanceId, teamId, capability, outputs, publishedAt]
      properties:
        instanceId: { type: string }
        teamId: { type: string }
        capability: { type: string, maxLength: 60 }
        outputs:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [output, kind, state]
            properties:
              output: { type: string }
              kind: { type: string, enum: [url, value, secret] }
              state: { type: string, enum: [not-issued, issued-and-placed, placement-unknown, re-issue-required] }
        publishedAt: { type: string, format: date-time }

    CapabilityShare:
      type: object
      additionalProperties: false
      required: [instanceId, capability, toTeamId, sharedAt, sharedBy]
      properties:
        instanceId: { type: string }
        capability: { type: string, maxLength: 60 }
        toTeamId: { type: string, maxLength: 120 }
        sharedAt: { type: string, format: date-time }
        sharedBy: { type: string, maxLength: 200 }

    BindingRecord:
      type: object
      additionalProperties: false
      required: [consumerInstanceId, capability, providerInstanceId, destinations, state, boundAt, boundBy]
      properties:
        consumerInstanceId: { type: string }
        capability: { type: string, maxLength: 60 }
        providerInstanceId: { type: string }
        destinations:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [output, into]
            properties:
              output: { type: string }
              into: { type: array, items: { type: string } }
        state: { type: string, enum: [bound, stale] }
        boundAt: { type: string, format: date-time }
        boundBy: { type: string, maxLength: 200 }

    Instance:
      type: object
      additionalProperties: false
      required: [id, teamId, name, template, state, provider, createdAt, updatedAt]
      properties:
        id: { type: string, minLength: 1 }
        teamId: { type: string, minLength: 1 }
        name:
          type: string
          minLength: 1
          maxLength: 80
          pattern: '^[a-z0-9]([a-z0-9-]{0,78}[a-z0-9])?$'
          description: |
            The half of `team/name` a person types (D45). Slug rules, enforced in the schema and the database:
            a name needing escapes or a disambiguating id is a name that will break in a URL, a CLI argument,
            or a shell.
        template: { type: string, minLength: 1, description: 'The template this instance was created from. Formerly the field `platform`, which stored a template id -- D45.' }
        templateRef:
          type: object
          additionalProperties: false
          required: [repo, commitSha]
          properties:
            repo: { type: string, minLength: 3, maxLength: 200 }
            commitSha: { type: string, pattern: '^[0-9a-f]{40}$', description: 'Pinned by commit, never by a movable tag (D30 law 3).' }
        state:
          type: string
          enum: [pending, provisioning, live, degraded, paused, failed, deprovisioning, removed]
          description: |
            The rollup, not the truth: production's state when a production environment exists, otherwise the
            worst among the environments (#179). `environments` below is what actually happened per place.
        environments:
          type: array
          description: One row per environment the instance has. Absent until the first reconcile.
          items:
            type: object
            additionalProperties: false
            required: [instanceId, environment, state, updatedAt]
            properties:
              instanceId: { type: string }
              environment: { type: string, minLength: 1, maxLength: 60 }
              state: { type: string, enum: [pending, provisioning, live, degraded, paused, failed, deprovisioning, removed] }
              appliedPlanHash: { type: string }
              attestationId: { type: string }
              updatedAt: { type: string, format: date-time }
        provider: { type: string, enum: [railway, fake] }
        desiredPlanHash: { type: string, pattern: '^[0-9a-f]{64}$' }
        lastAppliedPlanHash: { type: string, pattern: '^[0-9a-f]{64}$' }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    DispatchIntent:
      type: object
      additionalProperties: false
      required: [instanceId, teamId, dispatchId, nonce, planHash, action, environment, issuedAt, expiresAt]
      properties:
        instanceId: { type: string }
        teamId: { type: string }
        dispatchId: { type: string }
        nonce: { type: string, minLength: 16, maxLength: 64 }
        planHash: { type: string, pattern: '^[0-9a-f]{64}$' }
        action: { type: string, enum: [apply, destroy] }
        environment: { type: string, minLength: 1 }
        issuedAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }

    Attestation:
      type: object
      additionalProperties: false
      required: [dispatchId, instanceId, nonce, planHash, action, environment, result, resources, release, durationMs, finishedAt]
      properties:
        dispatchId: { type: string }
        instanceId: { type: string }
        nonce: { type: string, minLength: 16 }
        planHash: { type: string, pattern: '^[0-9a-f]{64}$' }
        action: { type: string, enum: [apply, destroy] }
        environment: { type: string }
        result: { type: string, enum: [ok, partial, failed, noop] }
        resources:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [kind, name, status]
            properties:
              kind: { type: string }
              name: { type: string }
              externalId: { type: string }
              status: { type: string }
        errorCode: { type: string, maxLength: 200 }
        release:
          type: object
          additionalProperties: false
          required: [version, commitSha, imageDigest]
          properties:
            version: { type: string }
            commitSha: { type: string, pattern: '^[0-9a-f]{7,40}$' }
            imageDigest: { type: string, pattern: '^sha256:[0-9a-f]{64}$' }
        durationMs: { type: integer, minimum: 0 }
        finishedAt: { type: string, format: date-time }

    AttestationRecord:
      # Written out rather than composed with allOf: `additionalProperties: false` inside one allOf member
      # rejects the fields declared only in the other member, so a correct response fails validation. The
      # duplication is deliberate and the comment is the maintenance note -- a generated client would otherwise
      # receive a type it cannot satisfy.
      type: object
      additionalProperties: false
      required: [dispatchId, instanceId, nonce, planHash, action, environment, result, resources, release, durationMs, finishedAt, receivedAt, actorKind]
      properties:
        dispatchId: { type: string }
        instanceId: { type: string }
        nonce: { type: string, minLength: 16 }
        planHash: { type: string, pattern: '^[0-9a-f]{64}$' }
        action: { type: string, enum: [apply, destroy] }
        environment: { type: string }
        result: { type: string, enum: [ok, partial, failed, noop] }
        resources:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [kind, name, status]
            properties:
              kind: { type: string }
              name: { type: string }
              externalId: { type: string }
              status: { type: string }
        errorCode: { type: string, maxLength: 200 }
        release:
          type: object
          additionalProperties: false
          required: [version, commitSha, imageDigest]
          properties:
            version: { type: string }
            commitSha: { type: string, pattern: '^[0-9a-f]{7,40}$' }
            imageDigest: { type: string, pattern: '^sha256:[0-9a-f]{64}$' }
        durationMs: { type: integer, minimum: 0 }
        finishedAt: { type: string, format: date-time }
        receivedAt: { type: string, format: date-time }
        actorKind: { type: string, enum: [runner, operator, shared-secret] }
        actorRef: { type: string, maxLength: 200 }

    AuditEntry:
      type: object
      additionalProperties: false
      required: [id, at, actorKind, actorRef, action, target, detail]
      properties:
        id: { type: string }
        at: { type: string, format: date-time }
        actorKind: { type: string, enum: [user, runner, controller, system] }
        actorRef: { type: string, maxLength: 200 }
        action: { type: string, maxLength: 120 }
        target: { type: string, maxLength: 200 }
        detail:
          type: object
          additionalProperties: { type: [string, number, boolean] }

    Health:
      type: object
      additionalProperties: false
      required: [status, livenessToken]
      properties:
        status: { type: string, enum: [ok] }
        livenessToken:
          type: string
          pattern: '^[0-9a-f]{16}$'
          description: sha256(commit + version), truncated. Not a credential.

    Ready:
      type: object
      additionalProperties: false
      required: [status, checks]
      properties:
        status: { type: string, enum: [ready, not-ready] }
        checks:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/ReadinessCheck' }
    ReadinessCheck:
      type: object
      additionalProperties: false
      required: [name, status]
      properties:
        name:
          type: string
          description: Dependency identifier, stable across builds (`database`, `identity`).
        status: { type: string, enum: [ok, degraded, failed, not-configured] }
        detail:
          type: string
          description: |
            Present for `degraded` and `failed`, and it must not contain a credential, DSN or connection
            string — names and reasons only (D4).

    Version:
      type: object
      additionalProperties: false
      required: [name, version, commit, buildTime, providerContract]
      properties:
        name: { type: string, enum: [control-plane] }
        version: { type: string, minLength: 1 }
        commit:
          type: string
          pattern: '^[0-9a-f]{7,40}$'
        buildTime: { type: string, format: date-time }
        providerContract:
          type: object
          additionalProperties: false
          required: [name, version]
          properties:
            name: { type: string, enum: [infra.provider] }
            version: { type: string, pattern: '^[0-9]+\.[0-9]+\.[0-9]+' }

    Whoami:
      type: object
      additionalProperties: false
      required: [subject, issuer, audience, clientId, scope, expiresAt, tenantAuthority]
      properties:
        subject: { type: string, minLength: 1, description: 'The token `sub`. Never a secret.' }
        issuer: { type: string, description: 'The `iss` that was checked against the pinned issuer.' }
        audience:
          type: array
          items: { type: string }
          minItems: 1
          description: 'The `aud` claim(s) that satisfied the required audience.'
        clientId: { type: string, description: 'Authorized party (`azp` or `client_id`).' }
        scope:
          type: array
          items: { type: string }
          description: Empty when the token carries none; absence is not the same as `all`.
        expiresAt: { type: string, format: date-time }
        tenantAuthority:
          type: boolean
          const: false
          description: |
            Always false, and asserted rather than implied: this token authenticates a platfolio user to
            platfolio and confers no authority over tenant infrastructure (docs/design/05 invariants).

    Error:
      type: object
      additionalProperties: false
      required: [error, message]
      properties:
        error:
          type: string
          description: Machine-readable code. Stable, so clients branch on it rather than on prose.
        message:
          type: string
          maxLength: 300
          description: |
            Human-readable, and credential-safe by construction: the server redacts credential-shaped text
            before writing it (the same `redactCredentialShaped` rule the managed action applies to
            attestation fields).
