# Managed by platfolio. Review before merging.
# Deleting this file stops platfolio managing the stack; ordinary deploys keep working,
# because the push triggers below are the same ones your own workflow used.
name: platfolio managed

on:
  workflow_dispatch:
    inputs:
      instance_id: { required: true, type: string }
      dispatch_id: { required: true, type: string }
      nonce: { required: true, type: string, description: "single-use, echoed back in the attestation" }
      plan_hash: { required: true, type: string }
      action: { required: true, type: choice, options: [apply, check, drift, suspend, export] }
      environment: { required: true, type: choice, options: [production] }
  push:
    branches:
      - production

permissions:
  checks: write
  contents: read
  id-token: write
  statuses: write

concurrency:
  group: platfolio-${{ inputs.dispatch_id || github.run_id }}
  cancel-in-progress: false

jobs:
  managed:
    name: platfolio ${{ inputs.action || 'deploy' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v7

      - name: Check the control-plane endpoint is configured
        env:
          PLATFOLIO_URL: ${{ vars.PLATFOLIO_URL }}
        run: |
          if [ -z "$PLATFOLIO_URL" ]; then
            echo "::error::repository variable PLATFOLIO_URL is unset. Point it at your platfolio control plane,"
            echo "::error::for example https://api.example.com -- see docs/MAINTAINING.md."
            exit 1
          fi
          echo "dispatching to the platfolio control plane configured for this repository"

      - name: Apply desired state with this repository's own credentials
        id: apply
        uses: fractalsynapse/platfolio/.github/actions/platfolio-managed@d40412fd727f4af1405afdc7898ffcf753ae37b7
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          PLATFOLIO_DISPATCH_TOKEN: ${{ secrets.PLATFOLIO_DISPATCH_TOKEN }}
          RAILWAY_WORKSPACE_ID: 82ba4aff-61f3-4b19-b863-8b650ebb66b2
        with:
          action: ${{ inputs.action || 'deploy' }}
          environment: ${{ inputs.environment }}
          instance_id: ${{ inputs.instance_id }}
          dispatch_id: ${{ inputs.dispatch_id }}
          nonce: ${{ inputs.nonce }}
          plan_hash: ${{ inputs.plan_hash }}
          # D47: an endpoint that belongs to a running environment is environment configuration, so it is a
          # repository variable and not a committed literal. This line has carried a generated
          # `{service}-{environment}-{hash}.up.railway.app` hostname before -- instance-specific, different
          # per deployment, and not something a tenant can be pointed at. The guard step below turns an
          # unset variable into a clear message instead of a fetch against an empty URL.
          platfolio_url: ${{ vars.PLATFOLIO_URL }}
          platfolio_url: https://api.platfolio.dev

      - name: Report the outcome for platfolio to verify by read-back
        if: always()
        run: echo "outcome=${{ steps.apply.outcome }}"
        # The runner posts a signed attestation to platfolio from the action above; the control
        # plane treats it as a claim and re-verifies against the provider before advancing.

