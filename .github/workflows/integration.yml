name: Integration
# Pushes to staging (integration results) and pull requests targeting main (pre-production review).
# Adds the E9 experiment to the shared gates, because staging is where a candidate must be proven
# before a human decides on main.
on:
  push:
    branches:
      - staging
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: integration-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  project-checks:
    name: Project checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Enable pnpm (version pinned by packageManager)
        run: corepack enable

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Full gate set (docs lint, vendored tree, types, tests, contract drift)
        run: pnpm run verify

  experiment-e9:
    name: E9 kernel experiment
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      # The spike keeps its own npm lockfile on purpose: it pins the exact published framework
      # packages it measured, independently of the repository's pnpm toolchain.
      - name: Install spike dependencies from its lockfile
        working-directory: spikes/e9-cordis-kernel
        run: npm ci --no-audit --no-fund

      - name: Run E9 (boots without --expose-internals; provider selected by configuration)
        working-directory: spikes/e9-cordis-kernel
        run: npx -y tsx driver.ts

      - name: Confirm the spike ran without privileged Node internals
        working-directory: spikes/e9-cordis-kernel
        run: |
          node -e 'if (process.execArgv.includes("--expose-internals")) { console.error("must not be present in CI"); process.exit(1); } console.log("confirmed: no --expose-internals");'

  # The persistence seam is only a claim if the second implementation runs in CI too. A conformance suite that
  # skips itself for want of a database is how a driver drifts from its interface without anyone noticing --
  # which is the exact class of gap this project keeps finding and closing.
  store-conformance:
    name: Store conformance (Postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.11
        env:
          POSTGRES_PASSWORD: ci-only-not-a-secret
          POSTGRES_DB: platfolio
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d platfolio"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      PLATFOLIO_DB_URL: postgresql://postgres:ci-only-not-a-secret@localhost:5432/platfolio
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Enable pnpm (version pinned by packageManager)
        run: corepack enable

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Migrate the schema the way a deployment does
        run: pnpm run db:migrate

      - name: Run the suite with the database present (nothing may skip silently)
        run: pnpm run test
