name: Production
# Runs on every push to main (the production gate) and on every tag push, because GitHub's tag
# filters cannot express semver. A tag is treated as a release ONLY when it matches bare
# <major>.<minor>.<patch>, optionally with -prerelease or +build metadata (decision D19).
#
# A tag that looks like an old-style `v1.2.3` attempt fails loudly rather than quietly skipping:
# silent no-op is the worst outcome for a release attempt. Unrelated tags are noted and ignored.
#
# Tag rule (docs/MAINTAINING.md): a tag may be cut only on a commit that already passed this workflow
# on main. release-gate requires an EARLIER successful run of this same workflow for the identical
# commit whose ref was refs/heads/main — the tag's own run does not satisfy it.
# Nothing here publishes a release.
on:
  push:
    branches:
      - main
    tags:
      - '*'

permissions:
  contents: read
  actions: read

concurrency:
  group: production-${{ github.ref == 'refs/heads/main' && 'main' || github.ref }}
  cancel-in-progress: false

env:
  RELEASE_TAG_RE: '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$'

jobs:
  classify_tag:
    name: Classify tag
    runs-on: ubuntu-latest
    outputs:
      kind: ${{ steps.classify.outputs.kind }}
    steps:
      - name: "Classify ${{ github.ref_name }}"
        id: classify
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
        run: |
          # Deliberately env-var only: GitHub interpolates expressions inside run bodies as well, so
          # an empty or malformed placeholder here would invalidate the whole workflow file. Using
          # environment variables also keeps the rule testable outside Actions.
          if [ "$EVENT_NAME" != "push" ] || [ "$(printf '%s' "$REF" | cut -d/ -f1-2)" != "refs/tags" ]; then
            echo "kind=none" >> "$GITHUB_OUTPUT"
            echo "not a tag push; release jobs stay off"
            exit 0
          fi
          tag="${GITHUB_REF_NAME}"
          if printf '%s' "$tag" | grep -qE "$RELEASE_TAG_RE"; then
            echo "kind=release" >> "$GITHUB_OUTPUT"
            echo "release tag accepted: $tag"
          elif printf '%s' "$tag" | grep -qE '^v[0-9]'; then
            echo "kind=mistyped" >> "$GITHUB_OUTPUT"
            echo "::error::tag '$tag' uses the retired 'v' prefix. Release tags are bare <major>.<minor>.<patch> (e.g. 0.1.0). Delete the tag and re-cut it without the prefix; never rename a published tag."
          else
            echo "kind=other" >> "$GITHUB_OUTPUT"
            echo "::notice::tag '$tag' is not a release tag; release jobs are skipped."
          fi

  reject-mistyped-tag:
    name: Reject mistyped release tag
    needs: [classify_tag]
    if: needs.classify_tag.outputs.kind == 'mistyped'
    runs-on: ubuntu-latest
    steps:
      - name: Fail the release attempt
        run: |
          echo "::error::release tags must be bare semver such as 0.1.0 — see docs/MAINTAINING.md (decision D19)"
          exit 1

  gate:
    name: Production checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Enable pnpm (version pinned by packageManager)
        run: corepack enable

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Full gate set (docs lint, vendored tree, types, tests, contract drift)
        run: pnpm run verify

  experiment-e9:
    name: E9 kernel experiment
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install spike dependencies from its lockfile
        working-directory: spikes/e9-cordis-kernel
        run: npm ci --no-audit --no-fund

      - name: Run E9
        working-directory: spikes/e9-cordis-kernel
        run: npx -y tsx driver.ts

  release-gate:
    name: Release tag policy
    needs: [classify_tag, gate, experiment-e9]
    if: needs.classify_tag.outputs.kind == 'release'
    runs-on: ubuntu-latest
    steps:
      # The license check inspects the tagged tree, so this job needs it present. Without a checkout the
      # workspace is empty and every release fails on a missing LICENSE that is in fact committed —
      # found by the first tag whose commit satisfied the prior-run gate (run 42443489234).
      - uses: actions/checkout@v7

      - name: Require a prior passing production run of this commit on main
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: |
          # The run-list endpoint has no `ref` field — only `head_branch`, which is "main" for a branch
          # push and the tag name for a tag push. Filtering on `.ref` silently matches nothing and would
          # block every real release (found by the #7 tag experiment). A 404 is also legitimate here (no
          # such workflow history for that commit) and must fall through to the explanatory failure.
          # --paginate emits one count per page, so the counts are summed rather than case-tested.
          runs=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/production.yml/runs?head_sha=$SHA&per_page=100" \
            --paginate --jq '[.workflow_runs[] | select(.head_branch == "main" and .event == "push" and .status == "completed" and .conclusion == "success")] | length' 2>/dev/null \
            | awk '{s+=$1} END {print s+0}')
          case "$runs" in (''|*[!0-9]*) runs=0;; esac
          echo "successful main-branch Production runs for $SHA: $runs"
          if [ "$runs" -lt 1 ]; then
            echo "::error::refusing to release: commit $SHA has no passing Production run on main. Cut tags only after this workflow has succeeded for that exact commit on main."
            exit 1
          fi

      - name: Require a license before any release identity exists
        run: |
          if [ ! -f LICENSE ] && [ ! -f LICENSE.md ] && [ ! -f LICENSE.txt ]; then
            echo "::error::no license file at the repository root on this commit. platfolio code may not be distributed under a release identity without one."
            exit 1
          fi
          echo "license present: continuing"

  release-notes:
    name: Assemble release provenance
    needs: [classify_tag, release-gate]
    if: needs.classify_tag.outputs.kind == 'release'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Record identity and provenance
        run: |
          mkdir -p out
          # Previous release = a bare semver tag reachable from THIS commit, excluding this tag.
          # "second-to-newest tag in the repo" is wrong: it ignores the tagged commit, so a first
          # release reports itself and a tag on an older commit can report a newer release (#20).
          # Ambiguity acknowledged: two release tags on the same commit have no ordering between them;
          # the changelog guard below already skips the range when prev equals the current tag.
          prev=$(git tag --merged HEAD --list | grep -E "$RELEASE_TAG_RE" | grep -vx "${GITHUB_REF_NAME}" | sort -V | tail -n 1)
          {
            echo "# Release ${GITHUB_REF_NAME}"
            echo
            echo "- tag: \`${GITHUB_REF_NAME}\`"
            echo "- commit: \`$(git rev-parse HEAD)\`"
            echo "- created: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "- previous release: ${prev:-none}"
            echo
            echo "## Changes since previous release"
            echo
            if [ -n "$prev" ] && [ "$prev" != "${GITHUB_REF_NAME}" ]; then
              git log --no-merges --pretty='- %s (%h)' "${prev}..HEAD"
            else
              git log --no-merges --pretty='- %s (%h)' -n 40
            fi
          } > out/RELEASE_NOTES.md
          cat out/RELEASE_NOTES.md

      - name: Checksum the tree contents that the tag freezes
        run: |
          git ls-files -z | sort -z | xargs -0 sha256sum > out/SOURCE_SHA256SUMS.txt
          sha256sum out/SOURCE_SHA256SUMS.txt > out/MANIFEST_SHA256SUMS.txt
          wc -l < out/SOURCE_SHA256SUMS.txt | sed 's/^/tracked files manifested: /'

      - name: Upload provenance artifact
        uses: actions/upload-artifact@v7
        with:
          name: release-provenance-${{ github.ref_name }}
          path: out/
          if-no-files-found: error

      - name: Publication boundary
        run: |
          echo "This workflow prepares and proves a release identity; it does not publish one."
          echo "Creating a GitHub Release, uploading installers or announcing availability are separate"
          echo "actions requiring the maintainer's authority (docs/MAINTAINING.md)."
