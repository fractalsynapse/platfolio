name: Image

# M1 step 6: platfolio's own stack must be buildable as a container and publishable with a digest an
# operator can pin. Building is also the cheapest way to keep the Dockerfile honest -- a manifest plan
# refuses a placeholder digest, so a real pinned image is the only thing that can prove the hosting chain.

on:
  push:
    branches:
      - staging
      - main
  pull_request:
    branches:
      - staging
      - main
  workflow_dispatch:

# Publishing needs packages: write. Declaring it only on the publish step is invalid when the workflow
# level does not grant it, and that failure kills the run before any log exists -- which is how a
# permissions mistake looks like a mystery.
permissions:
  contents: read
  packages: write

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE_NAME: ${{ github.repository }}-control-plane

jobs:
  build:
    name: Build and smoke-test candidate images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # A build that cannot produce the lockfile-pinned dependency set is not the same artifact CI just
      # tested, so the frozen install inside the image is load-bearing rather than cosmetic.
      - name: Validate the build context
        run: |
          test -f apps/control-plane/Dockerfile || { echo "Dockerfile missing"; exit 1; }
          grep -q "frozen-lockfile" apps/control-plane/Dockerfile || { echo "image install is not lockfile-frozen"; exit 1; }
          # Runtime files the app reads. Asserted here because their absence is invisible to `docker build`
          # and fatal on the first validated request: without api/ every spec-checked response 500s on ENOENT,
          # and without db/ PLATFOLIO_DB_MIGRATE=true cannot migrate.
          test -f apps/control-plane/openapi.yaml || { echo "the OpenAPI document is missing from the app it governs"; exit 1; }
          grep -q "^COPY apps/control-plane ./apps/control-plane" apps/control-plane/Dockerfile || { echo "the Dockerfile does not copy the app, so it cannot ship the app's own openapi.yaml"; exit 1; }
          grep -q "^COPY db ./db" apps/control-plane/Dockerfile || { echo "Dockerfile does not ship db/ -- migrations cannot run"; exit 1; }

      - name: Build
        run: |
          docker build \
            --file apps/control-plane/Dockerfile \
            --build-arg PLATFOLIO_COMMIT="${{ github.sha }}" \
            --build-arg PLATFOLIO_BUILD_TIME="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --tag platfolio-control-plane:build \
            .

      - name: Build the site image
        id: site
        run: |
          SITE_IMAGE=$(docker compose config --format json | jq -er '.services.site.image')
          docker compose build --build-arg PLATFOLIO_COMMIT="$GITHUB_SHA" site
          echo "image=$SITE_IMAGE" >> "$GITHUB_OUTPUT"

      - name: Smoke test the site image
        env:
          SITE_IMAGE: ${{ steps.site.outputs.image }}
        run: |
          docker run -d --rm --name site-smoke --publish 127.0.0.1::4321 "$SITE_IMAGE"
          trap 'docker stop site-smoke >/dev/null' EXIT
          address=$(docker port site-smoke 4321/tcp)
          origin="http://$address"
          status=""
          for i in $(seq 1 30); do
            if status=$(curl --fail --silent "$origin/status") && [ "$status" = '{"status":"ok"}' ]; then break; fi
            sleep 1
          done
          test "$status" = '{"status":"ok"}'
          curl --fail --silent "$origin/version.json" > site-version.json
          jq -e --arg sha "$GITHUB_SHA" '.commit == $sha' site-version.json
          curl --fail --silent "$origin/" > site-landing.html
          if grep -q '<script' site-landing.html; then exit 1; fi
          curl --fail --silent "$origin/dashboard" | grep -q '<astro-island'
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' "$origin/callback?state=smoke")" = 200
          curl --fail --silent "$origin/config.js" | grep -F 'window.__PLATFOLIO_SITE_CONFIG__'

      - name: Build and smoke-test the identity image
        id: identity
        run: |
          IDENTITY_IMAGE=$(docker compose config --format json | jq -er '.services.identity.image')
          docker compose build identity
          docker run -d --rm --name identity-smoke --publish 127.0.0.1::8080 "$IDENTITY_IMAGE" start-dev
          trap 'docker stop identity-smoke >/dev/null' EXIT
          address=$(docker port identity-smoke 8080/tcp)
          curl --fail --silent --retry 30 --retry-delay 2 --retry-all-errors --max-time 5 "http://$address/realms/master" >/dev/null
          docker cp identity-smoke:/opt/keycloak/themes/platfolio/login/resources/css/tokens.css identity-tokens.css
          cmp packages/ui/src/tokens.css identity-tokens.css
          docker cp identity-smoke:/opt/keycloak/themes/platfolio/login/resources/css/components.css identity-components.css
          cmp packages/ui/src/components/components.css identity-components.css
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' "http://$address/realms/platfolio")" = 404
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' -H 'Accept: text/html' "http://$address/realms/master/account/")" = 404
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' -H 'Accept: application/json' "http://$address/realms/master/account/")" = 401
          if docker run --rm "$IDENTITY_IMAGE" start-private > identity-missing-input.log 2>&1; then
            echo 'Private identity started without its owner inputs' >&2
            exit 1
          fi
          grep -q 'Set the private site origin' identity-missing-input.log
          echo "image=$IDENTITY_IMAGE" >> "$GITHUB_OUTPUT"

      # The image answers its own healthcheck during the run, so a green job means the container serves --
      # not merely that it assembled. This is the difference the project keeps insisting on.
      - name: Fail-closed check (no identity config, the container must refuse to start)
        run: |
          set -e
          out=$(docker run --rm platfolio-control-plane:build 2>&1 || true)
          echo "$out" | tail -3
          echo "$out" | grep -qi "cannot start" || { echo "container started without identity config -- fail-closed is broken"; exit 1; }
      - name: Smoke test the built container
        # A shape-only JWKS stands in for a realm here: this step proves the image boots, binds, serves
        # /status and reads its build identity. The Compose stack and live smoke exercise Keycloak signatures.
        run: |
          set -e
          node -e "require('http').createServer((q,s)=>{s.writeHead(200,{'content-type':'application/json'});s.end('{\"keys\":[{\"kty\":\"RSA\",\"kid\":\"ci-smoke\",\"alg\":\"RS256\",\"use\":\"sig\",\"n\":\"AKd-pem3OaiXvBmXb-mPAmgLBFLmAWhVNxXfkRDBMUWXQ7oJrbnVjhFHwOTb-wsBAwEAAQ\",\"e\":\"AQAB\"}]}')}).listen(9911)" &
          JWKS_PID=$!
          sleep 1
          docker run -d --rm --name cp-smoke -p 8080:8080 \
            -e PLATFOLIO_IDENTITY_ISSUER=http://host.docker.internal:9911/realms/platfolio \
            -e PLATFOLIO_IDENTITY_AUDIENCE=platfolio-api \
            -e PLATFOLIO_IDENTITY_JWKS_URI=http://host.docker.internal:9911/realms/platfolio/protocol/openid-connect/certs \
            -e HOST=0.0.0.0 -e PORT=8080 \
            platfolio-control-plane:build
          ok=""
          for i in $(seq 1 30); do
            if docker exec cp-smoke node -e "fetch('http://127.0.0.1:8080/status').then(async r=>process.exit(r.status===200 && (await r.json()).status==='ok'?0:1)).catch(()=>process.exit(1))"; then ok=1; break; fi
            sleep 2
          done
          if [ -z "$ok" ]; then echo "/status never returned ok"; docker logs cp-smoke; exit 1; fi
          # Confirm /version serves the candidate commit and the anonymous data request receives HTTP 401.
          version=$(docker exec cp-smoke node -e "fetch('http://127.0.0.1:8080/version').then(r=>r.text()).then(t=>process.stdout.write(t))")
          echo "  /version -> $version"
          jq -e --arg sha "$GITHUB_SHA" 'has("version") and .version == null and .commit == $sha' <<< "$version"
          code=$(docker exec cp-smoke node -e "fetch('http://127.0.0.1:8080/api/v1/instances').then(r=>process.stdout.write(String(r.status)))")
          echo "  unauthenticated GET /api/v1/instances -> $code"
          [ "$code" = "401" ] || { echo "expected 401 from the auth guard, got $code -- routes are not registered or the guard is not applied"; docker logs cp-smoke; exit 1; }
          echo "container healthy"
          docker stop cp-smoke
          kill $JWKS_PID 2>/dev/null || true

      - name: Smoke test the private installation worker
        run: |
          set -e
          cleanup() { docker rm -f launch-worker-smoke >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          docker run -d --name launch-worker-smoke --user 0 --tmpfs /launch-state \
            -e PLATFOLIO_LAUNCH_STATE_DIR=/launch-state -e PLATFOLIO_LAUNCH_TEAM=ci-team \
            -e PLATFOLIO_LAUNCH_WORKER_KEY="$(node -p 'require("node:crypto").randomBytes(32).toString("base64url")')" \
            -e PLATFOLIO_OPENBAO_WORKER_SECRET="$(node -p 'require("node:crypto").randomBytes(32).toString("base64url")')" \
            -e PLATFOLIO_OPENBAO_URL=http://127.0.0.1:8200 \
            -e PLATFOLIO_RAILWAY_OAUTH_CALLBACK=https://private-api.example.test/api/v1/railway/callback \
            -e RAILWAY_WORKSPACE_ID=ci-workspace -e HOST=127.0.0.1 platfolio-control-plane:build \
            sh -c "chown node:node /launch-state && exec su -s /bin/sh node -c 'node /app/scripts/customer-installation-worker.ts'"
          for attempt in $(seq 1 15); do
            if docker exec launch-worker-smoke node -e "fetch('http://127.0.0.1:8080/status').then(async r=>process.exit(r.ok && (await r.json()).status==='ok'?0:1)).catch(()=>process.exit(1))"; then
              exit 0
            fi
            sleep 1
          done
          docker logs launch-worker-smoke
          exit 1

      # Only pushes publish. A pull request gets a build and a smoke test, never a registry write.
      - name: Publish
        id: publish
        # Pushes only: a pull request gets a build and a smoke test, never a registry write.
        if: github.event_name == 'push'
        env:
          REGISTRY: ghcr.io
          CR_PAT: ${{ secrets.GITHUB_TOKEN }}
          SITE_IMAGE: ${{ steps.site.outputs.image }}
          IDENTITY_IMAGE: ${{ steps.identity.outputs.image }}
        run: |
          echo "$CR_PAT" | docker login "$REGISTRY" -u "$GITHUB_ACTOR" --password-stdin >/dev/null
          COMMIT_TAG="sha-$GITHUB_SHA"
          publish() {
            local service="$1" source="$2" repository="$3" pushed digest
            local image="$repository:$COMMIT_TAG"
            docker tag "$source" "$image"
            pushed=$(docker push "$image")
            digest=$(printf '%s\n' "$pushed" | sed -n 's/.*digest: \(sha256:[0-9a-f]*\).*/\1/p' | head -1)
            if ! [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "::error::The $service push did not report a valid image digest."
              exit 1
            fi
            docker tag "$source" "$repository:$GITHUB_REF_NAME"
            docker push "$repository:$GITHUB_REF_NAME"
            printf '%s_image=%s\n%s_digest=%s\n' "$service" "$image" "$service" "$digest" >> "$GITHUB_OUTPUT"
            printf -- '- %s: `%s@%s`\n' "$service" "$image" "$digest" >> "$GITHUB_STEP_SUMMARY"
          }
          echo '## Published images' >> "$GITHUB_STEP_SUMMARY"
          publish api platfolio-control-plane:build "$REGISTRY/$IMAGE_NAME"
          publish site "$SITE_IMAGE" "$SITE_IMAGE"
          publish identity "$IDENTITY_IMAGE" "$IDENTITY_IMAGE"

      - name: Record the release candidate
        if: github.event_name == 'push'
        env:
          API_IMAGE: ${{ steps.publish.outputs.api_image }}
          API_DIGEST: ${{ steps.publish.outputs.api_digest }}
          SITE_IMAGE: ${{ steps.publish.outputs.site_image }}
          SITE_DIGEST: ${{ steps.publish.outputs.site_digest }}
          IDENTITY_IMAGE: ${{ steps.publish.outputs.identity_image }}
          IDENTITY_DIGEST: ${{ steps.publish.outputs.identity_digest }}
        run: |
          jq -n --arg sourceCommit "$GITHUB_SHA" --arg runId "$GITHUB_RUN_ID" --arg runAttempt "$GITHUB_RUN_ATTEMPT" \
            --arg apiImage "$API_IMAGE" --arg apiDigest "$API_DIGEST" --arg siteImage "$SITE_IMAGE" --arg siteDigest "$SITE_DIGEST" \
            --arg identityImage "$IDENTITY_IMAGE" --arg identityDigest "$IDENTITY_DIGEST" \
            '{schemaVersion: 1, $sourceCommit, $runId, $runAttempt, images: {api: {image: $apiImage, digest: $apiDigest}, site: {image: $siteImage, digest: $siteDigest}, identity: {image: $identityImage, digest: $identityDigest} } }' \
            > release-candidate.json
      - name: Upload the release candidate
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v7
        with:
          name: release-candidate-${{ github.run_attempt }}
          path: release-candidate.json
          if-no-files-found: error
