name: Image

# M1 step 6: platfolio's own stack must be buildable as a container and publishable with a digest an
# operator can pin. Building is also the cheapest way to keep the Dockerfile honest -- a manifest plan
# refuses a placeholder digest, so a real pinned image is the only thing that can prove the hosting chain.

on:
  push:
    branches:
      - staging
      - main
  pull_request:
    branches:
      - staging
      - main
  workflow_dispatch:

# Publishing needs packages: write. Declaring it only on the publish step is invalid when the workflow
# level does not grant it, and that failure kills the run before any log exists -- which is how a
# permissions mistake looks like a mystery.
permissions:
  contents: read
  packages: write

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE_NAME: ${{ github.repository }}-control-plane

jobs:
  build:
    name: Build the control-plane image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # A build that cannot produce the lockfile-pinned dependency set is not the same artifact CI just
      # tested, so the frozen install inside the image is load-bearing rather than cosmetic.
      - name: Validate the build context
        run: |
          test -f apps/control-plane/Dockerfile || { echo "Dockerfile missing"; exit 1; }
          grep -q "frozen-lockfile" apps/control-plane/Dockerfile || { echo "image install is not lockfile-frozen"; exit 1; }

      - name: Build
        run: |
          docker build \
            --file apps/control-plane/Dockerfile \
            --build-arg PLATFOLIO_COMMIT="${{ github.sha }}" \
            --build-arg PLATFOLIO_VERSION="${{ github.ref_name }}" \
            --build-arg PLATFOLIO_BUILD_TIME="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --tag platfolio-control-plane:build \
            .

      # The image answers its own healthcheck during the run, so a green job means the container serves --
      # not merely that it assembled. This is the difference the project keeps insisting on.
      - name: Fail-closed check (no identity config, the container must refuse to start)
        run: |
          set -e
          out=$(docker run --rm platfolio-control-plane:build 2>&1 || true)
          echo "$out" | tail -3
          echo "$out" | grep -qi "cannot start" || { echo "container started without identity config -- fail-closed is broken"; exit 1; }
      - name: Smoke test the built container
        # A shape-only JWKS stands in for a realm here: this step proves the image boots, binds, serves
        # /healthz and reads its build identity -- NOT that signatures verify. That is proven against a real
        # Keycloak in the Compose stack and in the live tenant run, and CI cannot substitute for either.
        run: |
          set -e
          node -e "require('http').createServer((q,s)=>{s.writeHead(200,{'content-type':'application/json'});s.end('{\"keys\":[{\"kty\":\"RSA\",\"kid\":\"ci-smoke\",\"alg\":\"RS256\",\"use\":\"sig\",\"n\":\"AKd-pem3OaiXvBmXb-mPAmgLBFLmAWhVNxXfkRDBMUWXQ7oJrbnVjhFHwOTb-wsBAwEAAQ\",\"e\":\"AQAB\"}]}')}).listen(9911)" &
          JWKS_PID=$!
          sleep 1
          docker run -d --rm --name cp-smoke -p 8080:8080 \
            -e PLATFOLIO_IDENTITY_ISSUER=http://host.docker.internal:9911/realms/platfolio \
            -e PLATFOLIO_IDENTITY_AUDIENCE=platfolio-api \
            -e PLATFOLIO_IDENTITY_JWKS_URI=http://host.docker.internal:9911/realms/platfolio/protocol/openid-connect/certs \
            -e HOST=0.0.0.0 -e PORT=8080 \
            platfolio-control-plane:build
          ok=""
          for i in $(seq 1 30); do
            if docker exec cp-smoke node -e "fetch('http://127.0.0.1:8080/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"; then ok=1; break; fi
            sleep 2
          done
          if [ -z "$ok" ]; then echo "healthz never answered"; docker logs cp-smoke; exit 1; fi
          echo "container healthy"
          docker stop cp-smoke
          kill $JWKS_PID 2>/dev/null || true

      # Only pushes publish. A pull request gets a build and a smoke test, never a registry write.
      - name: Publish
        # Pushes only: a pull request gets a build and a smoke test, never a registry write.
        if: github.event_name == 'push'
        env:
          REGISTRY: ghcr.io
          CR_PAT: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$CR_PAT" | docker login "$REGISTRY" -u "$GITHUB_ACTOR" --password-stdin >/dev/null
          SHORT="$(echo "${{ github.sha }}" | cut -c1-7)"
          for tag in "sha-$SHORT" "${{ github.ref_name }}"; do
            docker tag platfolio-control-plane:build "$REGISTRY/$IMAGE_NAME:$tag"
            # The digest comes out of the push itself. A plan pins sha256:..., never a mutable tag, and
            # re-deriving it locally would need a go-template whose braces collide with this repo's
            # workflow placeholder lint.
            PUSHED="$(docker push "$REGISTRY/$IMAGE_NAME:$tag")"
            if [ "$tag" = "sha-$SHORT" ]; then
              DIGEST="$(printf '%s\n' "$PUSHED" | sed -n 's/.*digest: \(sha256:[0-9a-f]*\).*/\1/p' | head -1)"
            fi
          done
          # The digest is the whole point of publishing: a plan pins sha256:..., not a mutable tag.
          {
            echo "## Published image"
            echo ""
            echo "- Reference: \`$REGISTRY/$IMAGE_NAME:sha-$SHORT\`"
            echo "- **Pinned digest: \`${DIGEST:-unavailable}\`**"
            echo ""
            echo "Use the digest, never the tag: a tag is mutable and a plan that trusts one can be moved"
            echo "under a tenant. If this package is private, Railway cannot pull it until the package"
            echo "visibility is set to public (a maintainer action; the workflow token cannot change it)."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "  pinned digest: ${DIGEST:-unavailable}"
