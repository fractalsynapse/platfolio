apiVersion: platfolio.dev/v1alpha1
kind: Platform
metadata:
  name: example-full-stack
  version: 0.9.2
  title: ExampleFullStack
  summary: Architecture studio that grows software with agent-driven development across repository collections.
  archetype: full-stack-web
  repository: https://github.com/platfolio-fixtures/example-full-stack
  license: Apache-2.0
  architectures: [amd64, arm64]
spec:
  requires:
    platfolio: ">=0.1.0 <1"
    migrationWindow: 20m
  # This platform is a team service as well as a hosted app: the identity provider it runs is published
  # for other instances to require by capability, never by instance id (D34).
  provides:
    name: identity
    outputs:
      - { output: issuer, kind: url, description: Realm issuer URL consumers point their OIDC client at. }
      - { output: client_id, kind: value, description: Public client identifier issued to a consumer. }
      # Relayed once into the consumer's execution plane and never stored, so a lost value is re-issued
      # rather than replayed (D32). Declaring it here does not make it readable by anything.
      - { output: client_secret, kind: secret, description: Confidential client secret issued to a consumer. }
  identity:
    mode: hosted-realm
    clients:
      - service: web
        roles: [studio-admin, studio-user]
  environments:
    production: { enabled: true, branch: main }
    staging: { enabled: true, branch: staging, sleepByDefault: true }
    preview: { enabled: false }
  resources:
    database: { name: app-db, kind: postgres }
    cache: { name: example-full-stack-cache, kind: redis }
    volumes:
      - { name: workspace-data, service: agent, mountPath: /work, sizeGB: 50 }
  services:
    web:
      image: ghcr.io/platfolio-fixtures/example-full-stack-web:0.9.2
      digest: sha256:3333333333333333333333333333333333333333333333333333333333333333
      port: 3000
      healthPath: /api/health
      start: node build/index.js
      replicas: 2
      limits: { cpu: 1, memoryMB: 512 }
      env:
        NODE_ENV: production
        # Issuer supplied by hand. A team realm consumed across instances is OD11; until that lands this
        # cannot be resolved by the system, so it is written as a real value rather than a stand-in.
        OIDC_ISSUER: https://auth.example.com/realms/acme
        OIDC_CLIENT_ID: example-full-stack
      domains: [app.example.com]
      public: true
    api:
      image: ghcr.io/platfolio-fixtures/example-full-stack-api:0.9.2
      digest: sha256:4444444444444444444444444444444444444444444444444444444444444444
      port: 8080
      healthPath: /healthz
      start: java -jar /app/quarkus-run.jar
      preDeploy: ./mvnw -q verify -DskipTests
      replicas: 2
      limits: { cpu: 1, memoryMB: 1024 }
      env:
        # See the note on the web service: hand-supplied until OD11.
        OIDC_ISSUER: https://auth.example.com/realms/acme
        OIDC_CLIENT_ID: example-full-stack
      secrets:
        - { name: OIDC_CLIENT_SECRET, source: preserve }
        - { name: STRIPE_WEBHOOK_SECRET, source: preserve }
      dependsOn: [web]
      domains: [api.example.com]
      public: true
    keycloak:
      image: quay.io/keycloak/keycloak:26.0
      digest: sha256:6666666666666666666666666666666666666666666666666666666666666666
      port: 8080
      healthPath: /realms/master
      start: start-server --http-port=8080
      ownership: external
      limits: { cpu: 1, memoryMB: 1024 }
      env:
        KC_HOSTNAME_STRICT: "false"
      secrets:
        - { name: KEYCLOAK_ADMIN_INITIAL_ACCESS, source: preserve }
      domains: [auth.example.com]
      public: true
    agent:
      image: ghcr.io/platfolio-fixtures/example-full-stack-agent:0.9.2
      digest: sha256:5555555555555555555555555555555555555555555555555555555555555555
      port: 7070
      healthPath: /health
      replicas: 1
      limits: { cpu: 2, memoryMB: 2048 }
      env:
        WORKSPACE_ROOT: /work
      secrets:
        - { name: ANTHROPIC_API_KEY, source: preserve }
  dns: { ownershipVerification: txt, apexPolicy: cname-flattening-only }
  lifecycle:
    onSuspend: scale-to-zero
    onEject: [railway-iac, compose, data-export, realm-export, secret-inventory]
    onDelete: { graceDays: 30, backupAgeOutDays: 90 }
  observability: { uptimeChecks: ["app.example.com/api/health"], logRetentionDays: 7 }
  billing: { sku: example-full-stack-standard, metered: none }
