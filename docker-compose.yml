# platfolio's own local stack (D40): the control plane runs the architecture it will sell.
#
#   docker compose up -d postgres                                   # one database, two schemas
#   pnpm run db:migrate && pnpm run db:seed-dev                     # platfolio schema, one team to smoke with
#   docker compose up -d                                            # the rest
#   pnpm run identity:seed && pnpm run identity:smoke               # Keycloak realm, verified tokens
#   pnpm run lifecycle:smoke                                        # records, dispatch, attestation, controller
#
# Versions are pinned exactly, never ranged: Keycloak auto-migrates its own schema on the first boot of a new
# version (docs/design/05), so "latest" is a data-loss risk in a stack that holds a realm, and a floating
# Postgres tag changes the digest under a committed prod overlay.
name: platfolio

services:
  postgres:
    image: postgres:17.11
    environment:
      POSTGRES_PASSWORD: platfolio-dev-only
      POSTGRES_DB: platfolio
    ports:
      # Published for local tooling: `db:migrate`, the store conformance suite, the smoke scripts, psql.
      # Dev-only credentials, and the reason this file is a development topology and not a template.
      - '5432:5432'
    volumes:
      # Creates the `platfolio` and `keycloak` schemas on first init, so neither service owns the other's.
      - ./db/postgres-init:/docker-entrypoint-initdb.d:ro
      - platfolio-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d platfolio']
      interval: 5s
      timeout: 3s
      retries: 12

  identity:
    image: keycloak/keycloak:26.8.2
    # `start-dev`, on the SAME Postgres instance as the control plane and in its own schema: the consolidation
    # asked for (one container, one backup) without two owners in one namespace.
    #
    # The realm is created by `pnpm run identity:seed` -- an idempotent Admin-API script -- rather than
    # `--import-realm`. Keycloak 26.8.2's import format rejected role assignments in every shape tried here
    # (clientRoles on a client, federated on a user, realm-level clientMappings), and a file the product cannot
    # boot is worse than a script that works. Recorded as #168 rather than hidden.
    command: ['start-dev']
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/platfolio
      KC_DB_USERNAME: postgres
      KC_DB_PASSWORD: platfolio-dev-only
      KC_DB_SCHEMA: keycloak
      KC_BOOTSTRAP_ADMIN_USERNAME: platfolio-admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: platfolio-dev-only
      KC_HTTP_PORT: '8080'
      KC_HOSTNAME_STRICT: 'false'
    ports:
      - '8081:8080'
    depends_on:
      postgres:
        condition: service_healthy

  control-plane:
    image: node:22.22.1-slim
    working_dir: /workspace
    command: ['node', '--import', 'tsx', 'apps/control-plane/src/index.ts']
    environment:
      PORT: '8080'
      HOST: '0.0.0.0'
      # The issuer must match byte-for-byte what the token carries -- exact match is D4's cross-tenant rule --
      # so this is a value an operator reads, not a default that may drift.
      PLATFOLIO_IDENTITY_ISSUER: http://localhost:8081/realms/platfolio
      PLATFOLIO_IDENTITY_AUDIENCE: platfolio-api
      PLATFOLIO_IDENTITY_JWKS_URI: http://identity:8080/realms/platfolio/protocol/openid-connect/certs
      PLATFOLIO_DB_URL: postgresql://postgres:platfolio-dev-only@postgres:5432/platfolio
      # Migrate-on-boot is a local convenience. Production runs `pnpm run db:migrate` as a separate step,
      # because replicas boot concurrently and two of them issuing the same DDL is an outage.
      PLATFOLIO_DB_MIGRATE: 'true'
      PLATFOLIO_VERSION: 0.0.0-local
      PLATFOLIO_COMMIT: "0000000000000000000000000000000000000000"
      # Quoted on purpose: an unquoted all-digit scalar is read as a *number*, which then failed the OpenAPI
      # pattern for a commit SHA -- the fourth YAML-scalar defect in this project, and the compose file is
      # where it bit.
      PLATFOLIO_BUILD_TIME: '2026-11-11T00:00:00.000Z'
      PLATFOLIO_RECONCILE_INTERVAL_MS: '5000'
      # Email (D46): the real client against a real SMTP server, no stub in sight. startTls is off ONLY
      # because this is loopback to a dev sink; the same line in a production manifest would leak credentials
      # to anyone on the path.
      PLATFOLIO_EMAIL_DRIVER: smtp
      PLATFOLIO_EMAIL_FROM: platfolio@localhost
      PLATFOLIO_SMTP_HOST: mailpit
      PLATFOLIO_SMTP_PORT: '1025'
      PLATFOLIO_SMTP_STARTTLS: 'off'
      PLATFOLIO_MAILPIT_URL: http://mailpit:8025
    ports:
      - '8082:8080'
    volumes:
      - .:/workspace
    depends_on:
      postgres:
        condition: service_healthy
      identity:
        condition: service_started
      mailpit:
        condition: service_started

  # Mailpit (D46): an SMTP sink and a mailbox that tests can read. Everything platfolio sends in development
  # lands here, and `email:smoke` asserts on it through Mailpit's HTTP API -- "the invitation was sent to this
  # address with this link" becomes a checked fact rather than a log line somebody eyeballs. UI :8025, SMTP :1025.
  mailpit:
    image: axllent/mailpit:v1.24.0
    environment:
      # Development only: a local sink that accepts any credentials, so the SMTP client's auth path is
      # exercised without a real relay. A production transport never sets these.
      MP_SMTP_AUTH_ACCEPT_ANY: '1'
      MP_SMTP_AUTH_ALLOW_INSECURE: '1'
      MP_MAX_MESSAGES: '5000'
    ports:
      - '8025:8025'
      - '1025:1025'
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 10s
      timeout: 3s
      retries: 6

volumes:
  platfolio-pgdata:
