apiVersion: platfolio.dev/v1alpha1
kind: Platform
metadata:
  name: treedx
  version: 1.4.0
  title: TreeDX
  summary: Knowledge management service that unifies a collection of Git repositories into an AI context generation machine.
  archetype: api-service
  repository: https://github.com/fractalsynapse/treedx
  license: Apache-2.0
  architectures: [amd64, arm64]
spec:
  requires:
    platfolio: ">=0.1.0 <1"
    migrationWindow: 15m
  identity:
    mode: none
    clients: []
  environments:
    production: { enabled: true, branch: main }
    staging: { enabled: true, branch: staging, sleepByDefault: true }
    preview: { enabled: false }
  resources:
    database: { name: treedx-db, kind: postgres }
    storage: { name: repo-checkouts, region: iad }
    volumes:
      - { name: index-cache, service: worker, mountPath: /var/cache/treedx, sizeGB: 20 }
  services:
    api:
      image: ghcr.io/fractalsynapse/treedx-api
      digest: sha256:1111111111111111111111111111111111111111111111111111111111111111
      port: 8080
      healthPath: /healthz
      start: node dist/server.js
      replicas: 2
      limits: { cpu: 1, memoryMB: 1024 }
      env:
        LOG_LEVEL: info
        CONTEXT_BUDGET_TOKENS: "120000"
      secrets:
        - { name: TREEDX_API_SIGNING_KEY, source: preserve }
      domains: [api.treedx.example.com]
      public: true
    worker:
      image: ghcr.io/fractalsynapse/treedx-worker
      digest: sha256:2222222222222222222222222222222222222222222222222222222222222222
      port: 9090
      healthPath: /ready
      start: node dist/worker.js
      replicas: 1
      limits: { cpu: 2, memoryMB: 4096 }
      env:
        LOG_LEVEL: info
      dependsOn: [api]
  dns: { ownershipVerification: txt, apexPolicy: cname-flattening-only }
  lifecycle:
    onSuspend: scale-to-zero
    onEject: [railway-iac, compose, data-export, secret-inventory]
    onDelete: { graceDays: 30, backupAgeOutDays: 90 }
  observability: { uptimeChecks: ["api.treedx.example.com/healthz"], logRetentionDays: 7 }
  billing: { sku: treedx-standard, metered: none }
