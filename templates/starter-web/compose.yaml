# Starter web platform: one service that is reachable from outside. This is the shape that exercises the
# parts of platfolio a background job never touches -- a public host, TLS, and a managed database whose URL
# arrives as a reference rather than something the tenant types.
name: starter-web

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      NODE_ENV: production
    expose: ["8080"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
    x-platfolio:
      public: true
      # Deliberately no custom host here: an unverifiable domain sticks at `applying` forever without
      # failing, which reads as progress and is not. Add your own host once DNS ownership is confirmed.
      environments: [production]

x-platfolio:
  metadata:
    name: starter-web
    version: 0.1.0
    title: Starter Web Service
    summary: An externally reachable UI plus a JSON API, with a managed Postgres.
    archetype: full-stack-web
  requires:
    platfolio: ">=0.4.0 <1"
  resources:
    database: { name: app-db, kind: postgres }
  environments:
    production: { enabled: true, branch: main }
    staging: { enabled: false }
    preview: { enabled: false }
  dns: { ownershipVerification: txt, apexPolicy: cname-flattening-only }
  lifecycle: { onSuspend: scale-to-zero, onEject: [compose, data-export], onDelete: { graceDays: 30, backupAgeOutDays: 90 } }
