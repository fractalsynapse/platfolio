# The environment registry for this platform (D52): one file, one definition per variable, and the obligations,
# defaults and wiring a deploy needs. This replaced the old two-file arrangement -- a central registry plus
# `.platfolio/environment.yaml` -- because the same facts maintained twice drift, and one of the two was already
# stale in this repository's history.
#
# `kind` carries the design. `value` and `secret` are things an operator supplies or leaves defaulted; `reference`
# and `output` are wiring the platform resolves, and must never appear on a panel asking a tenant to type
# something (D33). `secret: true` is a custody claim, not a guess: platfolio stores no values (D4). `environments`
# is `all` or a subset of development | staging | production (D52). A name listed here must be referenced by the
# thing that reads it -- templates.test.ts enforces that for services this repository compiles.
variables:
- name: DATABASE_URL
  kind: reference
  secret: false
  environments: all
  service: web
  database: app-db
  output: DATABASE_URL
  deployedTo: railway:reference
  note: declared by starter-web
- name: UI_BRAND
  kind: value
  secret: false
  environments: all
  service: web
  default: Starter
  deployedTo: platform:default
  note: Shown in the page header; safe to change per deployment.
