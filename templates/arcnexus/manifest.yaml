apiVersion: platfolio.dev/v1alpha1
kind: Platform
metadata:
  name: arcnexus
  version: 0.9.2
  title: ArcNexus
  summary: Architecture studio that grows software with agent-driven development across repository collections.
  archetype: full-stack-web
  repository: https://github.com/fractalsynapse/arcnexus
  license: Apache-2.0
  architectures: [amd64, arm64]
spec:
  requires:
    platfolio: ">=0.1.0 <1"
    migrationWindow: 20m
  identity:
    mode: hosted-realm
    clients:
      - service: web
        roles: [studio-admin, studio-user]
  environments:
    production: { enabled: true, branch: main }
    staging: { enabled: true, branch: staging, sleepByDefault: true }
    preview: { enabled: false }
  resources:
    database: { name: arcnexus-db, kind: postgres }
    cache: { name: arcnexus-cache, kind: redis }
    volumes:
      - { name: workspace-data, service: agent, mountPath: /work, sizeGB: 50 }
  services:
    web:
      image: ghcr.io/fractalsynapse/arcnexus-web
      digest: sha256:3333333333333333333333333333333333333333333333333333333333333333
      port: 3000
      healthPath: /api/health
      start: node build/index.js
      replicas: 2
      limits: { cpu: 1, memoryMB: 512 }
      env:
        NODE_ENV: production
        # Issuer supplied by hand. A team realm consumed across instances is OD11; until that lands this
        # cannot be resolved by the system, so it is written as a real value rather than a stand-in.
        OIDC_ISSUER: https://auth.arcnexus.example.com/realms/acme
        OIDC_CLIENT_ID: arcnexus
      domains: [app.arcnexus.example.com]
      public: true
    api:
      image: ghcr.io/fractalsynapse/arcnexus-api
      digest: sha256:4444444444444444444444444444444444444444444444444444444444444444
      port: 8080
      healthPath: /healthz
      start: java -jar /app/quarkus-run.jar
      preDeploy: ./mvnw -q verify -DskipTests
      replicas: 2
      limits: { cpu: 1, memoryMB: 1024 }
      env:
        # See the note on the web service: hand-supplied until OD11.
        OIDC_ISSUER: https://auth.arcnexus.example.com/realms/acme
        OIDC_CLIENT_ID: arcnexus
      secrets:
        - { name: OIDC_CLIENT_SECRET, source: preserve }
        - { name: STRIPE_WEBHOOK_SECRET, source: preserve }
      dependsOn: [web]
      domains: [api.arcnexus.example.com]
      public: true
    keycloak:
      image: quay.io/keycloak/keycloak
      digest: sha256:6666666666666666666666666666666666666666666666666666666666666666
      port: 8080
      healthPath: /realms/master
      start: start-server --http-port=8080
      ownership: external
      limits: { cpu: 1, memoryMB: 1024 }
      env:
        KC_HOSTNAME_STRICT: "false"
      secrets:
        - { name: KEYCLOAK_ADMIN_INITIAL_ACCESS, source: preserve }
      domains: [auth.arcnexus.example.com]
      public: true
    agent:
      image: ghcr.io/fractalsynapse/arcnexus-agent
      digest: sha256:5555555555555555555555555555555555555555555555555555555555555555
      port: 7070
      healthPath: /health
      replicas: 1
      limits: { cpu: 2, memoryMB: 2048 }
      env:
        WORKSPACE_ROOT: /work
      secrets:
        - { name: ANTHROPIC_API_KEY, source: preserve }
  dns: { ownershipVerification: txt, apexPolicy: cname-flattening-only }
  lifecycle:
    onSuspend: scale-to-zero
    onEject: [railway-iac, compose, data-export, realm-export, secret-inventory]
    onDelete: { graceDays: 30, backupAgeOutDays: 90 }
  observability: { uptimeChecks: ["app.arcnexus.example.com/api/health"], logRetentionDays: 7 }
  billing: { sku: arcnexus-standard, metered: none }
