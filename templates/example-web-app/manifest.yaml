apiVersion: platfolio.dev/v1alpha1
kind: Platform
metadata:
  name: example-web-app
  version: 1.4.0
  title: ExampleWebApp
  summary: Knowledge management service that unifies a collection of Git repositories into an AI context generation machine.
  archetype: api-service
  repository: https://github.com/fractalsynapse/example-web-app
  license: Apache-2.0
  architectures: [amd64, arm64]
spec:
  requires:
    platfolio: ">=0.1.0 <1"
    migrationWindow: 15m
  # Named by capability, not by instance: the team can move to another provider without editing this
  # platform's file (D34). Where the resolved values land is the environment inventory's job.
  capabilities:
    - { capability: identity, as: [OIDC_ISSUER] }
  identity:
    mode: none
    clients: []
  environments:
    production: { enabled: true, branch: main }
    staging: { enabled: true, branch: staging, sleepByDefault: true }
    preview: { enabled: false }
  resources:
    database: { name: app-db, kind: postgres }
    storage: { name: repo-checkouts, region: iad }
    volumes:
      - { name: index-cache, service: worker, mountPath: /var/cache/example-web-app, sizeGB: 20 }
  services:
    api:
      image: ghcr.io/fractalsynapse/example-web-app-api:1.4.0
      digest: sha256:1111111111111111111111111111111111111111111111111111111111111111
      port: 8080
      healthPath: /healthz
      start: node dist/server.js
      replicas: 2
      limits: { cpu: 1, memoryMB: 1024 }
      env:
        LOG_LEVEL: info
        CONTEXT_BUDGET_TOKENS: "120000"
      secrets:
        - { name: APP_API_SIGNING_KEY, source: preserve }
      # Wiring, not a secret: the provider writes a provider-resolved reference and never holds the value.
      references:
        - { variable: DATABASE_URL, database: app-db, output: DATABASE_URL }
      domains: [api.example.com]
      public: true
    worker:
      image: ghcr.io/fractalsynapse/example-web-app-worker:1.4.0
      digest: sha256:2222222222222222222222222222222222222222222222222222222222222222
      port: 9090
      healthPath: /ready
      start: node dist/worker.js
      replicas: 1
      limits: { cpu: 2, memoryMB: 4096 }
      env:
        LOG_LEVEL: info
      dependsOn: [api]
  dns: { ownershipVerification: txt, apexPolicy: cname-flattening-only }
  lifecycle:
    onSuspend: scale-to-zero
    onEject: [railway-iac, compose, data-export, secret-inventory]
    onDelete: { graceDays: 30, backupAgeOutDays: 90 }
  observability: { uptimeChecks: ["api.example.com/healthz"], logRetentionDays: 7 }
  billing: { sku: example-web-app-standard, metered: none }
