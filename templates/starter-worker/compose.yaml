# Starter worker platform: scaled background processing with state on a volume that outlives the container.
# Nothing here accepts inbound connections, and that absence is the kind -- platfolio refuses this
# template if a host is ever attached to it.
name: starter-worker

services:
  queue:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      NODE_ENV: production
    expose: ["8080"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
    volumes:
      # The hibernate case: platfolio may destroy this service to save money and hand the same disk to the
      # next one. Compose's short syntax names the volume and the mount; retention for it is declared once,
      # under x-platfolio.resources.volumes, because Compose has no word for "keep this after the service".
      - job-state:/var/lib/starter-worker
    x-platfolio:
      environments: [production, staging]

x-platfolio:
  metadata:
    name: starter-worker
    version: 0.1.0
    title: Starter Worker Service
    summary: Scaled background workers that keep their state on a retained volume.
    kind: worker
    mode: development
  requires:
    platfolio: ">=0.4.0 <1"
  resources:
    volumes:
      - { name: job-state, service: queue, mountPath: /var/lib/starter-worker, sizeGB: 5, retention: survive }
  environments:
    production: { enabled: true, branch: main }
    staging: { enabled: true, branch: staging }
    preview: { enabled: false }
  dns: { ownershipVerification: txt, apexPolicy: cname-flattening-only }
  lifecycle: { onSuspend: scale-to-zero, onEject: [compose, data-export], onDelete: { graceDays: 30, backupAgeOutDays: 90 } }

# Declared here, not only in compose.dev.yaml: the service above mounts `job-state`, and Compose requires every
# named volume to be declared in the document that uses it. With the declaration only in the overlay,
# `docker compose -f compose.yaml config` failed outright -- "service "queue" refers to undefined volume
# job-state" -- so a tenant who forked this template had a platform description that could not be read without
# the development layer. The overlay still owns the LOCAL shape of these volumes; the platform file owns their
# existence and their retention (x-platfolio.resources.volumes).
volumes:
  job-state:
