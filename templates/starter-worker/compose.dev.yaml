# Local development for a starter-worker fork (D51): an OVERLAY on `compose.yaml`, never a second definition of
# the platform. The production description stays what platfolio reads; this file only adds what a laptop needs
# to run it -- a local database container, published ports, and the credentials that are true only on loopback.
#
#   docker compose -f compose.yaml -f compose.dev.yaml up --build
#
# Nothing here reaches a deployment: `platform:plan` reads compose.yaml + compose.prod.yaml, and the dev
# overlay is not part of the hosting contract. If a value appears here that the platform file also needs, that
# is a signal the value belongs in the platform file instead.

services:
  queue:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      NODE_ENV: development
      # No published port, on purpose: `kind: worker` means nothing connects inbound, and a dev file that
      # exposed one would be the first place the rule got quietly violated. Watch logs instead:
      #   docker compose -f compose.yaml -f compose.dev.yaml logs -f queue
      QUEUE_URL: postgres://postgres:dev-only@db:5432/app
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17
    environment:
      POSTGRES_PASSWORD: dev-only
      POSTGRES_DB: app
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d app']
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - queue-pgdata:/var/lib/postgresql/data

volumes:
  # Named exactly as the platform file uses it; locally these are plain docker volumes,
  # in production they are provider volumes with the retention the platform file declares.
  job-state:
  queue-pgdata:

x-platfolio:
  # Declared, not assumed: these containers exist because a laptop has to provide what a provider
  # would provision (the database) or replace entirely (an SMTP sink). `platform:plan` never reads
  # this file, so nothing here can reach a deployment -- and check-project.ts fails the build if an
  # overlay adds a service without naming it here (D50).
  devOnlyServices: [db]
