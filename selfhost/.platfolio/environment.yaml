# Obligations for the control plane, in the same inventory format every platform uses (D33).
# Declaring these for ourselves is the cheap way to find out whether the format answers the questions an
# operator actually asks; a first-party deployment that skips it proves nothing about ergonomics.
#
# This list is derived from what `apps/control-plane` reads, not from what an earlier design expected. The
# previous version named SESSION_SIGNING_KEY (there are no platform sessions -- tokens are the IdP's) and
# PUBLIC_ORIGIN (nothing reads it), and called KEYCLOAK_ISSUER optional when the control plane now refuses to
# start without it. A stale inventory is worse than none: an operator trusting it will deploy something that
# cannot boot.
- name: PLATFOLIO_IDENTITY_ISSUER
  kind: value
  required: true
  service: api
  description: >-
    The `iss` this platform will accept, verified against nothing else. Required: a control plane that starts
    without knowing its issuer is an open door with a logo on it.
- name: PLATFOLIO_IDENTITY_JWKS_URI
  kind: output
  from: identity#jwks
  required: true
  service: api
  description: >-
    Where signing keys are fetched. Required for the same reason -- without it, identity "verifies" nothing.
    Provided by the team Keycloak realm once it is hosted (D34); until then this is the blocking gap for a
    first-party deployment (#172).
- name: PLATFOLIO_IDENTITY_AUDIENCE
  kind: value
  required: true
  default: platfolio-api
  service: api
  description: The audience a token must carry. Checked, so a token minted for another service is refused.
- name: PLATFOLIO_DB_URL
  kind: secret
  required: false
  service: api
  description: >-
    Postgres connection string. Absent means the in-memory double and no persistence -- a development mode, not
    a deployment. Holds a credential, so it is a secret in the inventory's vocabulary and is never logged (D4).
- name: PLATFOLIO_DB_MIGRATE
  kind: value
  required: false
  default: "false"
  service: api
  description: Apply migrations at boot. Off by default so two replicas do not race the ledger.
- name: PLATFOLIO_RECONCILE_INTERVAL_MS
  kind: value
  required: false
  default: "60000"
  service: api
  description: How often the controller turns accepted attestations into instance state.
- name: PLATFOLIO_VERSION
  kind: value
  required: false
  service: api
  description: >-
    Build identity, injected as a build ARG by the image job and reported by /version. Never inferred from the
    filesystem at runtime, because a container that guesses its own version is a container that lies in an
    attestation.

# Email (D46). Derived from what `configFromEnv` reads, like every other name here: an inventory that lists a
# variable nobody consumes is the mistake the previous version of this file made with sessions.
- name: PLATFOLIO_EMAIL_DRIVER
  kind: value
  required: false
  default: none
  enum: [none, smtp, mailpit, memory]
  service: api
  description: >-
    Which transport exists at all. Absent means the control plane has no sender: an unconfigured default would
    let platfolio mail people under an identity no operator chose. `smtp` in staging and production, `mailpit`
    or `memory` locally, and `memory` in tests.
- name: PLATFOLIO_EMAIL_FROM
  kind: value
  required: false
  default: platfolio@localhost
  service: api
  description: The envelope sender. platfolio's own address, never a tenant's.
- name: PLATFOLIO_SMTP_HOST
  kind: value
  required: false
  service: api
  description: The relay. A remote SMTP provider in production (D46), Mailpit on the loopback network in development.
- name: PLATFOLIO_SMTP_PORT
  kind: value
  required: false
  default: "587"
  service: api
- name: PLATFOLIO_SMTP_SECURE
  kind: value
  required: false
  default: "false"
  service: api
  description: '"true" means implicit TLS (465). Otherwise STARTTLS is negotiated when the relay offers it.'
- name: PLATFOLIO_SMTP_STARTTLS
  kind: value
  required: false
  default: require
  enum: [require, allow, off]
  service: api
  description: >-
    `require` refuses to send to a relay that will not upgrade -- the default, and the one production must use.
    `off` exists for the loopback dev sink and is spelled out in the Compose file so it cannot be mistaken for
    a production setting. Credentials are never sent over an unencrypted connection regardless of this value.
- name: PLATFOLIO_SMTP_USER
  kind: value
  required: false
  service: api
- name: PLATFOLIO_SMTP_PASSWORD
  kind: secret
  required: false
  service: api
  description: >-
    Held in the environment, never persisted by platfolio, never echoed into a failure reason (D4). The SMTP
    client passes through the same redaction as attestations, because a relay can put anything in a 5xx line.
- name: PLATFOLIO_MAILPIT_URL
  kind: value
  required: false
  service: api
  description: >-
    The read-back endpoint for local runs only. A production relay offers no mailbox to read, and `readable`
    says so rather than pretending.
