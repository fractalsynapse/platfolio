# platfolio, described the way platfolio describes everything else (D29): plain Compose for topology,
# x-platfolio for hosting semantics. This is a first-party deployment, not a catalog entry -- D28 keeps the
# shipped catalog free of platform identities, and this one is deliberately excluded from it.
#
# The point of authoring it this way is that step 7 stops being an exception: the control plane is hosted by
# the same code path a tenant uses, so any rough edge in the format is found here rather than by a tenant.
name: platfolio-control-plane

services:
  api:
    build:
      context: ../../
      dockerfile: apps/control-plane/Dockerfile
    expose: ["8080"]
    environment:
      NODE_ENV: production
      # Every name below is declared in .platfolio/environment.yaml, which is the same inventory format every
      # hosted platform uses -- platfolio hosting itself has no exemption from its own contract (D33).
      PLATFOLIO_IDENTITY_ISSUER: ${PLATFOLIO_IDENTITY_ISSUER}
      PLATFOLIO_IDENTITY_AUDIENCE: ${PLATFOLIO_IDENTITY_AUDIENCE}
      PLATFOLIO_IDENTITY_JWKS_URI: ${PLATFOLIO_IDENTITY_JWKS_URI}
      # Without a database the control plane starts in-memory and says so; that is a development mode, not a
      # deployment, and the readiness of a real one comes from the migrations ledger.
      PLATFOLIO_DB_URL: ${PLATFOLIO_DB_URL:-}
      # Email (D46): a remote relay in a real deployment. `require` for STARTTLS is the default and is written
      # explicitly here so a reviewer can see it rather than trust a default.
      PLATFOLIO_EMAIL_DRIVER: ${PLATFOLIO_EMAIL_DRIVER:-smtp}
      PLATFOLIO_EMAIL_FROM: ${PLATFOLIO_EMAIL_FROM:-platfolio@platfolio.dev}
      PLATFOLIO_SMTP_HOST: ${PLATFOLIO_SMTP_HOST}
      PLATFOLIO_SMTP_PORT: ${PLATFOLIO_SMTP_PORT:-587}
      PLATFOLIO_SMTP_STARTTLS: require
      PLATFOLIO_SMTP_USER: ${PLATFOLIO_SMTP_USER}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 3s
      retries: 3
    x-platfolio:
      # Declared by NAME, never by value (D4). The validator refused the literal I first wrote -- a credential
      # appearing in an env assignment is exactly what this platform must not store or read -- so the hosting
      # layer supplies it at run time and platfolio only knows it exists.
      secrets:
        - { name: PLATFOLIO_SMTP_PASSWORD, source: shared-variable }
      public: true
      # No custom domain until DNS ownership of platfolio.dev is confirmed. Measured (E27): attaching a host
      # we cannot verify sticks at `applying` forever and the certificate never issues -- a state that looks
      # like progress and is not. The first self-host run uses Railway's generated host, which does reach
      # `active` + a valid certificate without any delegation.
      # domains: [api.platfolio.dev]
      environments: [production]


x-platfolio:
  metadata:
    name: platfolio-control-plane
    version: 0.4.0
    title: Platfolio Control Plane
    summary: The control plane hosting itself, so the hosting path is tested on software we own.
    archetype: api-service
    repository: https://github.com/fractalsynapse/platfolio
  capabilities: []
  environments:
    production: { enabled: true, branch: staging }
    staging: { enabled: false }
    preview: { enabled: false }
  dns:
    ownershipVerification: txt
    apexPolicy: cname-flattening-only
  lifecycle:
    onSuspend: scale-to-zero
    onEject: [compose, data-export]
    onDelete: { graceDays: 30, backupAgeOutDays: 90 }
  release:
    registryImage: ghcr.io/fractalsynapse/platfolio-control-plane
    dockerfile: apps/control-plane/Dockerfile
    tagPattern: "{branch}"
